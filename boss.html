<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>남씨네 사장님 앱</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f7f5f0;
  --surface:#ffffff;
  --surface2:#faf8f4;
  --border:#e8e4dc;
  --border2:#d4cfc5;
  --text:#1a1714;
  --text2:#6b6560;
  --text3:#9e9890;
  --brown:#8b5e3c;
  --brown2:#c4956a;
  --brown3:#f0e6d8;
  --green:#2d6a4f;
  --green2:#dcf0e6;
  --red:#c0392b;
  --red2:#fde8e6;
  --blue:#1e4d8c;
  --blue2:#ddeaf8;
  --gold:#b8860b;
  --gold2:#fdf4d8;
  --radius:14px;
  --shadow:0 2px 12px rgba(0,0,0,.07);
  --shadow2:0 8px 32px rgba(0,0,0,.12);
}
body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);font-size:14px;min-height:100vh}
.app{max-width:900px;margin:0 auto;padding:1rem}
.header{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 0 1rem;border-bottom:2px solid var(--border);margin-bottom:1.25rem}
.header-left{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;background:var(--brown);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.title{font-family:'Noto Serif KR',serif;font-size:18px;font-weight:700;color:var(--text)}
.subtitle{font-size:11px;color:var(--text3);margin-top:2px}
.settings-btn{padding:7px 14px;border-radius:8px;border:1px solid var(--border2);background:var(--surface);color:var(--text2);font-size:12px;cursor:pointer;font-family:inherit;font-weight:600}
.settings-btn:hover{background:var(--surface2)}
.nav{display:flex;gap:6px;margin-bottom:1.25rem;flex-wrap:wrap}
.nb{padding:8px 16px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text2);font-size:13px;cursor:pointer;font-family:inherit;font-weight:500;transition:all .15s}
.nb:hover{background:var(--surface2)}
.nb.active{background:var(--brown);color:#fff;border-color:var(--brown)}
.panel{display:none}.panel.active{display:block}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.1rem 1.3rem;margin-bottom:10px}
.card-title{font-size:12px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.5px;margin-bottom:.6rem}
.card-value{font-size:28px;font-weight:700;font-family:'Noto Serif KR',serif}
.card-sub{font-size:12px;color:var(--text3);margin-top:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:600px){.grid4{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}
.badge.up{background:var(--green2);color:var(--green)}
.badge.down{background:var(--red2);color:var(--red)}
.badge.neutral{background:var(--surface2);color:var(--text3)}
.badge.gold{background:var(--gold2);color:var(--gold)}
.channel-bar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:8px 0}
.ch-seg{transition:width .3s}
.ch-legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.ch-dot{width:9px;height:9px;border-radius:2px;flex-shrink:0}
.ch-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2)}
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:120px;padding-bottom:22px;position:relative;margin-top:.5rem}
.bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bar{width:100%;border-radius:5px 5px 0 0;background:var(--brown2);min-height:4px;transition:height .4s;position:relative;cursor:pointer}
.bar.cur{background:var(--brown)}
.bar:hover::after{content:attr(data-tip);position:absolute;top:-28px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;font-size:10px;padding:3px 7px;border-radius:5px;white-space:nowrap;z-index:10}
.bar-label{font-size:10px;color:var(--text3);position:absolute;bottom:0}
.product-row{display:flex;align-items:center;gap:10px;padding:.55rem 0;border-bottom:1px solid var(--border)}
.product-row:last-child{border-bottom:none}
.prod-rank{width:22px;height:22px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--text2);flex-shrink:0}
.prod-rank.r1{background:var(--gold);color:#fff}
.prod-rank.r2{background:var(--brown2);color:#fff}
.prod-rank.r3{background:var(--brown3);color:var(--brown)}
.prod-name{flex:1;font-size:13px;font-weight:600}
.prod-bar-wrap{width:100px;height:6px;background:var(--border);border-radius:3px;overflow:hidden}
.prod-bar-fill{height:100%;background:var(--brown2);border-radius:3px}
.prod-count{font-size:12px;color:var(--text3);min-width:40px;text-align:right}
.meeting-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem}
.meeting-title{font-family:'Noto Serif KR',serif;font-size:17px;font-weight:700}
.section-label{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:.5rem;margin-top:1rem}
.auto-section{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:.85rem 1rem;margin-bottom:.75rem}
.auto-row{display:flex;justify-content:space-between;align-items:center;padding:.3rem 0;border-bottom:1px solid var(--border);font-size:13px}
.auto-row:last-child{border-bottom:none}
.auto-label{color:var(--text2)}
.auto-value{font-weight:700}
.task-item{display:flex;align-items:center;gap:10px;padding:.6rem .9rem;background:var(--surface);border:1px solid var(--border);border-radius:9px;margin-bottom:6px}
.task-chk{width:20px;height:20px;border-radius:5px;border:2px solid var(--border2);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;transition:all .15s}
.task-chk.done{background:var(--green);border-color:var(--green);color:#fff}
.task-chk.over{border-color:var(--red);background:var(--red2)}
.task-content{flex:1}
.task-title{font-size:13px;font-weight:600}
.task-meta{font-size:11px;color:var(--text3);margin-top:2px}
.decision-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.85rem 1rem;margin-bottom:8px}
.decision-agenda{font-size:13px;font-weight:700;margin-bottom:.4rem}
.decision-content{font-size:13px;color:var(--text2);margin-bottom:.5rem}
.decision-assign{display:flex;gap:8px;font-size:11px}
.assign-chip{background:var(--brown3);color:var(--brown);padding:3px 9px;border-radius:20px;font-weight:600}
.date-chip{background:var(--gold2);color:var(--gold);padding:3px 9px;border-radius:20px;font-weight:600}
.fg{margin-bottom:.75rem}
.fl{font-size:12px;color:var(--text2);font-weight:600;margin-bottom:4px;display:block}
input[type=text],input[type=date],input[type=number],input[type=month],select,textarea{width:100%;font-size:13px;padding:8px 11px;border-radius:8px;border:1px solid var(--border2);background:var(--surface);color:var(--text);font-family:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brown)}
textarea{resize:vertical;min-height:70px}
.fr2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.btn{padding:8px 16px;border-radius:8px;border:1px solid var(--border2);background:var(--surface);color:var(--text);font-size:13px;cursor:pointer;font-family:inherit;font-weight:600;transition:all .15s}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--brown);color:#fff;border-color:var(--brown)}
.btn.pri:hover{background:#7a5235}
.btn.green{background:var(--green);color:#fff;border-color:var(--green)}
.btn.sm{padding:6px 12px;font-size:12px}
.btn.dan{color:var(--red);border-color:#fca5a5}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:.75rem}
.ai-chat{display:flex;flex-direction:column;gap:10px;margin-bottom:1rem}
.ai-msg{max-width:85%;padding:.8rem 1rem;border-radius:12px;font-size:13px;line-height:1.6}
.ai-msg.user{background:var(--brown);color:#fff;align-self:flex-end;border-radius:12px 12px 3px 12px}
.ai-msg.assistant{background:var(--surface);border:1px solid var(--border);align-self:flex-start;border-radius:12px 12px 12px 3px}
.ai-msg.thinking{color:var(--text3);font-style:italic}
.ai-input-row{display:flex;gap:8px}
.ai-input-row input{flex:1}
.ai-suggestion{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:.75rem}
.ai-sug-btn{padding:6px 12px;border:1px solid var(--border2);border-radius:20px;background:var(--surface);font-size:12px;cursor:pointer;font-family:inherit;color:var(--text2);transition:all .15s}
.ai-sug-btn:hover{border-color:var(--brown);color:var(--brown)}
.data-gap-alert{background:var(--gold2);border:1px solid #e6c96a;border-radius:10px;padding:.75rem 1rem;font-size:12px;color:var(--gold);margin-bottom:.75rem}
.data-gap-alert strong{display:block;margin-bottom:4px;font-size:13px}
.settings-section{margin-bottom:1.25rem}
.settings-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:.6rem}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:100;padding:1rem}
.modal{background:var(--surface);border-radius:16px;padding:1.5rem;width:480px;max-width:100%;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow2)}
.modal-title{font-size:16px;font-weight:700;margin-bottom:1.1rem;font-family:'Noto Serif KR',serif}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:1rem}
.loading-wrap{display:flex;align-items:center;justify-content:center;gap:10px;padding:2.5rem;color:var(--text3);font-size:13px}
.spin{width:20px;height:20px;border:2px solid var(--border2);border-top-color:var(--brown);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.share-view{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem}
.share-header{text-align:center;margin-bottom:1.5rem;padding-bottom:1rem;border-bottom:2px solid var(--border)}
.share-logo{font-size:28px;margin-bottom:.4rem}
.share-meeting-title{font-family:'Noto Serif KR',serif;font-size:20px;font-weight:700;margin-bottom:.3rem}
.share-date{font-size:12px;color:var(--text3)}
.share-section{margin-bottom:1.25rem}
.share-section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--text3);margin-bottom:.6rem;padding-bottom:.4rem;border-bottom:1px solid var(--border)}
.share-task-item{display:flex;align-items:center;gap:8px;padding:.4rem 0;font-size:13px}
.share-decision{padding:.6rem .8rem;background:var(--surface2);border-radius:8px;margin-bottom:.5rem;font-size:13px}
.share-decision-title{font-weight:700;margin-bottom:.25rem}
.share-decision-meta{font-size:11px;color:var(--text3)}
.toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:.65rem 1.25rem;border-radius:20px;font-size:13px;font-weight:600;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.empty{text-align:center;padding:2.5rem;color:var(--text3);font-size:13px}
.empty-icon{font-size:32px;margin-bottom:.5rem}
.divider{height:1px;background:var(--border);margin:1rem 0}
.memo-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:.75rem 1rem;margin-bottom:8px}
.memo-date{font-size:11px;color:var(--text3);margin-bottom:.25rem}
.memo-text{font-size:13px;line-height:1.5}
.memo-tag{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;margin-top:.4rem}
.conn-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:4px}
.conn-ok{background:#22c55e}
.conn-err{background:#ef4444}
.conn-loading{background:#f59e0b;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="header-left">
      <div class="logo">🍡</div>
      <div>
        <div class="title">남씨네 사장님 앱</div>
        <div class="subtitle" id="connStatus">연결 중...</div>
      </div>
    </div>
    <button class="settings-btn" onclick="showPanel('settings')">⚙ 설정</button>
  </div>
  <div class="nav">
    <button class="nb active" onclick="showPanel('dash')">📊 대시보드</button>
    <button class="nb" onclick="showPanel('trend')">📈 추이</button>
    <button class="nb" onclick="showPanel('meeting')">📋 회의록</button>
    <button class="nb" onclick="showPanel('note')">📓 경영노트</button>
    <button class="nb" onclick="showPanel('ai')">🤖 AI 분석</button>
    <button class="nb" onclick="showPanel('memo')">📝 메모</button>
  </div>
  <div class="panel active" id="panel-dash"><div id="dashContent"><div class="loading-wrap"><div class="spin"></div>데이터 불러오는 중...</div></div></div>
  <div class="panel" id="panel-trend"><div id="trendContent"><div class="loading-wrap"><div class="spin"></div>데이터 불러오는 중...</div></div></div>
  <div class="panel" id="panel-meeting"><div id="meetingContent"></div></div>
  <div class="panel" id="panel-ai"><div id="aiContent"></div></div>
  <div class="panel" id="panel-note"><div id="noteContent"></div></div>
  <div class="panel" id="panel-memo"><div id="memoContent"></div></div>
  <div class="panel" id="panel-settings">
    <div class="card">
      <div class="settings-title">GAS 연결 설정</div>
      <div class="fg"><label class="fl">장부앱 GAS URL</label><input type="text" id="set_gasUrl" placeholder="https://script.google.com/macros/s/.../exec"></div>
      <div class="fg"><label class="fl">인사앱 GAS URL</label><input type="text" id="set_hrGasUrl" placeholder="https://script.google.com/macros/s/.../exec"></div>
      <div class="fg"><label class="fl">사장님앱 데이터 GAS URL (동기화용)</label><input type="text" id="set_dataGasUrl" placeholder="https://script.google.com/macros/s/.../exec"><div style="font-size:11px;color:var(--text3);margin-top:4px">경영노트·회의록·메모를 모든 기기에서 쓰려면 입력하세요</div></div>
      <div class="btn-row">
        <button class="btn pri" onclick="saveSettings()">저장 및 연결</button>
        <button class="btn" onclick="loadSyncData()">🔄 동기화 새로고침</button>
        <button class="btn" onclick="showPanel('dash')">취소</button>
      </div>
    </div>
    <div class="card">
      <div class="settings-title">AI API 설정</div>
      <div class="fg"><label class="fl">Anthropic API Key</label><input type="text" id="set_apiKey" placeholder="sk-ant-..."><div style="font-size:11px;color:var(--text3);margin-top:4px">앱에만 저장됩니다. 외부에 전송되지 않습니다.</div></div>
      <div class="btn-row"><button class="btn pri" onclick="saveApiKey()">저장</button></div>
    </div>
    <div class="card">
      <div class="settings-title">회사 정보</div>
      <div class="fg"><label class="fl">사장님 이름</label><input type="text" id="set_ownerName" placeholder="남씨네"></div>
      <div class="btn-row"><button class="btn pri" onclick="saveCompanyInfo()">저장</button></div>
    </div>
  </div>
</div>
<div class="overlay" id="overlay" style="display:none" onclick="closeModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title" id="modalTitle"></div>
    <div id="modalBody"></div>
    <div class="modal-actions" id="modalActions"></div>
  </div>
</div>
<div class="overlay" id="shareOverlay" style="display:none">
  <div class="modal" style="max-width:680px" onclick="event.stopPropagation()">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">
      <div style="font-family:'Noto Serif KR',serif;font-size:16px;font-weight:700">📤 회의록 공유</div>
      <button class="btn sm" onclick="document.getElementById('shareOverlay').style.display='none'">닫기</button>
    </div>
    <div id="shareViewContent"></div>
    <div class="btn-row" style="margin-top:1rem">
      <button class="btn pri" onclick="copyShareText()">📋 텍스트 복사</button>
      <button class="btn green" onclick="window.print()">🖨 인쇄</button>
      <button class="btn" onclick="document.getElementById('shareOverlay').style.display='none'">닫기</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
// ── 상태 ──────────────────────────────────────────────
const S = {
  gasUrl: '',
  hrGasUrl: '',
  dataGasUrl: '',
  apiKey: '',
  ownerName: '사장님',
  orders: [],
  funeralOrders: [],
  weddingOrders: [],
  otherOrders: [],
  purchases: [],
  importedPurchases: [],   // ★ 추가: 엑셀 과거 매입 데이터 (매입내역 시트)
  channelSales: {},         // ★ 추가: POS/온라인 채널 매출
  employees: [],
  payHistory: {},
  otAll: {},
  absence: {},
  meetings: [],
  memos: [],
  bizNotes: [],
  aiChatHistory: {},
  currentPanel: 'dash',
  dataLoaded: false,
  loading: false
};

function init() {
  loadConfig();
  if (S.gasUrl) {
    loadAllData();
  } else {
    showPanel('settings');
    toast('GAS URL을 먼저 설정해 주세요', 3000);
  }
  if (S.dataGasUrl) loadSyncData();
  renderMeeting();
  renderMemo();
  renderNote();
  renderAI();
}

function loadConfig() {
  S.gasUrl = ls('gasUrl') || '';
  S.hrGasUrl = ls('hrGasUrl') || '';
  S.dataGasUrl = ls('dataGasUrl') || '';
  S.apiKey = ls('apiKey') || '';
  S.ownerName = ls('ownerName') || '사장님';
  S.meetings = JSON.parse(ls('meetings') || '[]');
  S.memos = JSON.parse(ls('memos') || '[]');
  S.bizNotes = JSON.parse(ls('bizNotes') || '[]');
  S.aiChatHistory = JSON.parse(ls('aiChatHistory') || '{}');
  S.channelSales = JSON.parse(ls('channelSales') || '{}');
  document.getElementById('set_gasUrl').value = S.gasUrl;
  document.getElementById('set_hrGasUrl').value = S.hrGasUrl;
  document.getElementById('set_dataGasUrl').value = S.dataGasUrl;
  document.getElementById('set_apiKey').value = S.apiKey;
  document.getElementById('set_ownerName').value = S.ownerName;
}

function syncSettings() {
  syncToGAS('settings', {
    gasUrl: S.gasUrl,
    hrGasUrl: S.hrGasUrl,
    dataGasUrl: S.dataGasUrl,
    ownerName: S.ownerName,
    apiKey: S.apiKey
  });
}

function saveSettings() {
  S.gasUrl = document.getElementById('set_gasUrl').value.trim();
  S.hrGasUrl = document.getElementById('set_hrGasUrl').value.trim();
  S.dataGasUrl = document.getElementById('set_dataGasUrl').value.trim();
  setLs('gasUrl', S.gasUrl);
  setLs('hrGasUrl', S.hrGasUrl);
  setLs('dataGasUrl', S.dataGasUrl);
  syncSettings();
  toast('저장됐어요');
  loadAllData();
  if (S.dataGasUrl) loadSyncData();
  showPanel('dash');
}
function saveApiKey() {
  S.apiKey = document.getElementById('set_apiKey').value.trim();
  setLs('apiKey', S.apiKey);
  syncSettings();
  toast('API 키 저장됐어요');
}
function saveCompanyInfo() {
  S.ownerName = document.getElementById('set_ownerName').value.trim() || '사장님';
  setLs('ownerName', S.ownerName);
  syncSettings();
  toast('저장됐어요');
}

function gasGetJSONP(url, params, timeoutMs) {
  return new Promise((resolve, reject) => {
    const cbName = 'gcb_' + Date.now() + '_' + Math.floor(Math.random()*99999);
    let settled = false;
    const done = (fn) => { if(settled) return; settled=true; fn(); };
    const timer = setTimeout(() => {
      done(() => { try { delete window[cbName]; script.remove(); } catch(e){} reject(new Error('JSONP timeout')); });
    }, timeoutMs || 10000);
    window[cbName] = (data) => {
      done(() => { clearTimeout(timer); try { delete window[cbName]; script.remove(); } catch(e){} resolve(data); });
    };
    const script = document.createElement('script');
    const q = new URLSearchParams({...(params||{}), callback: cbName}).toString();
    script.src = url + '?' + q;
    script.onerror = () => {
      done(() => { clearTimeout(timer); try { delete window[cbName]; script.remove(); } catch(e){} reject(new Error('JSONP script error')); });
    };
    document.head.appendChild(script);
  });
}

async function loadSyncData() {
  if (!S.dataGasUrl) return;
  try {
    const r = await gasGet(S.dataGasUrl, { action: 'loadAll' });

function syncToGAS(key, value) {
  if (!S.dataGasUrl) return;
  try {
    fetch(S.dataGasUrl, {
      method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action: 'save', key: key, value: value })
    }).catch(function(){});
  } catch(e) {}
}

function fetchWithTimeout(url, options, ms) {
  return Promise.race([
    fetch(url, options),
    new Promise((_, reject) => setTimeout(() => reject(new Error('fetch timeout')), ms))
  ]);
}

async function gasGet(url, params) {
  const q = new URLSearchParams(params || {}).toString();
  const fullUrl = url + (q ? '?' + q : '');
  try {
    const res = await fetchWithTimeout(fullUrl, { redirect: 'follow' }, 10000);
    const text = await res.text();
    return JSON.parse(text);
  } catch(e1) {
    try { return await gasGetJSONP(url, params, 10000); }
    catch(e2) { throw new Error('fetch: ' + e1.message + ' / jsonp: ' + e2.message); }
  }
}

function normalizeDate(d) {
  if (!d) return '';
  const s = String(d);
  if (s.includes('T')) { const dt = new Date(new Date(s).getTime() + 9*3600000); return dt.toISOString().slice(0,10); }
  if (/^\d{5}$/.test(s)) { const dt = new Date(new Date(1899,11,30).getTime() + parseInt(s)*86400000); return dt.toISOString().slice(0,10); }
  return s.slice(0,10);
}

function allOrders() {
  return [
    ...S.orders.map(o => ({...o, ch:'개인'})),
    ...S.funeralOrders.map(o => ({...o, ch:'장례'})),
    ...S.weddingOrders.map(o => ({...o, ch:'웨딩'})),
    ...S.otherOrders.map(o => ({...o, ch:'기타'}))
  ];

function monthOrders(ym) {
  const dateField = o => o.deliveryDate || o.createdAt || '';
  return allOrders().filter(o => {
    const d = normalizeDate(dateField(o));
    return d && d.startsWith(ym) && (o.payStatus === '완료' || o.payStatus === '결제완료' || o.payStatus !== '대기');
  });
}

function monthPurchase(ym) {

  return all.filter(p => getYM(p.date) === ym).reduce((s, p) => s + (Number(p.amount) || 0), 0);
}

function calcGrossFromData(e, ym) {
  const monthlyPayH = Number(e.monthlyPayHours) || 209;
  const totalPay    = Number(e.totalPay || 0);
  const base        = Number(e.base || 0);
  const meal        = Number(e.meal || 0);
  const basePay = totalPay || base;
  const hr = basePay / monthlyPayH;
  let dailyH = 8;
  if (e.schedule && typeof e.schedule === 'object') {
    const days = Object.keys(e.schedule);
    if (days.length) {
      const tot = days.reduce((s, d) => {
        const ds = e.schedule[d];
        const h = (parseInt(ds.e||18) - parseInt(ds.s||9)) - (parseFloat(ds.b||1) || 1);
        return s + (h < 0 ? h + 24 : h);
      }, 0);
      dailyH = tot / days.length;
    }
  } else if (e.workHours) { dailyH = Number(e.workHours); }
  const otMonth = (S.otAll[e.id] || {})[ym] || {};
  let extH = 0, nightH = 0, holH = 0;
  Object.values(otMonth).forEach(d => { extH += Number(d.ext||0); nightH += Number(d.night||0); holH += Number(d.holiday||0); });
  const absMonth = (S.absence[e.id] || {})[ym] || {};
  const absDays = Object.values(absMonth).reduce((s, v) => s + Number(v || 0), 0);
  let mealActual = meal;
  if (meal > 0 && absDays > 0) {
    const workDayCnt = calcMonthWorkDays_simple(ym);
    mealActual = workDayCnt > 0 ? Math.round(meal * Math.max(0, workDayCnt - absDays) / workDayCnt) : meal;
  }
  const extPay    = Math.round(hr * 1.5 * extH);
  const nightPay  = Math.round(hr * 2.0 * nightH);
  const holPay    = Math.round(hr * 1.5 * holH);
  const absDeduct = Math.round(absDays * hr * dailyH);
  const gross     = basePay + extPay + nightPay + holPay + mealActual - absDeduct;
  return { gross, extPay, nightPay, holPay, absDeduct, absDays, extH, nightH, holH, meal: mealActual, isCalc: true };
}

function calcMonthWorkDays_simple(ym) {
  const [y, m] = ym.split('-').map(Number);
  const dim = new Date(y, m, 0).getDate();
  let cnt = 0;
  for (let d = 1; d <= dim; d++) { const dow = new Date(y, m-1, d).getDay(); if (dow !== 0 && dow !== 6) cnt++; }
  return cnt;
}

function monthLaborCost(ym) {
  if (!S.employees.length) return null;
  let total = 0, found = false;
  for (const e of S.employees) {
    const hist = S.payHistory[e.id] || [];
    const rec = hist.find(h => String(h.month || h.ym || h.mo || '') === String(ym));
    if (rec && rec.gross) { total += Number(rec.gross); found = true; }
  }
  if (found) return { total, source: 'history' };
  if (Object.keys(S.otAll||{}).length || Object.keys(S.absence||{}).length) {
    let calcTotal = 0;
    for (const e of S.employees) { const r = calcGrossFromData(e, ym); calcTotal += r.gross; }
    return { total: calcTotal, source: 'calc' };
  }
  const contractTotal = S.employees.reduce((s, e) => s + Number(e.totalPay || e.base || 0), 0);
  return { total: contractTotal, source: 'contract' };
}

function empMonthPay(e, ym) {
  const hist = S.payHistory[e.id] || [];
  const rec = hist.find(h => String(h.month || h.ym || h.mo || '') === String(ym));
  if (rec && rec.gross) return { pay: Number(rec.gross), isActual: true, source: 'history' };
  if (Object.keys(S.otAll||{}).length || Object.keys(S.absence||{}).length) {
    const r = calcGrossFromData(e, ym);
    return { pay: r.gross, isActual: false, source: 'calc' };
  }
  return { pay: Number(e.totalPay || e.base || 0), isActual: false, source: 'contract' };
}

function getLast12Months() {
  const months = [];
  const now = new Date();
  for (let i = 11; i >= 0; i--) {
    const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
    months.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);
  }
  return months;
}

function changeMonth(dir) {

  if (next > todayYM()) return;
  S.selectedYM = next;
  renderDash();
}

function todayYM() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
function currentYM() { return S.selectedYM || prevYM_real(); }
function prevYM_real() { const d = new Date(); d.setMonth(d.getMonth() - 1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
function prevYM() { const [y, m] = currentYM().split('-').map(Number); const d = new Date(y, m - 2, 1); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
function comma(n) { return Number(n||0).toLocaleString('ko-KR'); }
function won(n) { return comma(n) + '원'; }
function diffBadge(cur, prev) {
  if (!prev) return '';
  const p = ((cur - prev) / prev * 100).toFixed(1);
  const cls = p > 0 ? 'up' : p < 0 ? 'down' : 'neutral';
  const arrow = p > 0 ? '▲' : p < 0 ? '▼' : '→';
  return `<span class="badge ${cls}">${arrow} ${Math.abs(p)}%</span>`;
}

function parseProducts(orders) {
  const counts = {};
  for (const o of orders) {
    const t = o.tteokType || '';
    const parts = t.split(/[,，、]+/).map(s => s.trim()).filter(Boolean);
    for (const p of parts) {
      const m = p.match(/^(.+?)\s+[\d.]+/);
      const name = m ? m[1].trim() : p.replace(/\s*[\d.]+.*$/, '').trim();
      if (name && name.length > 1) counts[name] = (counts[name] || 0) + 1;
    }
  }
  return Object.entries(counts).sort((a,b) => b[1]-a[1]);
}

function renderDash() {
  if (!S.selectedYM) S.selectedYM = prevYM_real();

  const laborLabel = laborSource === 'history' ? '' : laborSource === 'calc' ? ' 계산' : ' 계약액';
  const totalCost = pur + laborEst;
  const profit = rev - totalCost;

  const chOrders = monthOrders(ym);
  const chMap = { 개인:0, 장례:0, 웨딩:0, 기타:0 };
  const chRev = { 개인:0, 장례:0, 웨딩:0, 기타:0 };
  chOrders.forEach(o => { chMap[o.ch] = (chMap[o.ch]||0) + 1; chRev[o.ch] = (chRev[o.ch]||0) + (Number(o.priceTotal)||0); });
  const chTotal = Object.values(chRev).reduce((a,b)=>a+b,0) || 1;

function diagLaborCost() {
  const ym = S.selectedYM || prevYM_real();
  const [y, m] = ym.split('-');
  const ymLabel = `${y}년 ${parseInt(m)}월`;
  let html = `<div style="font-size:13px;margin-bottom:.75rem;color:var(--text2)">HR GAS에서 받아온 급여이력 원본 데이터입니다.</div>`;
  if (!S.employees.length) {
    html += `<div style="color:var(--red);font-size:13px">⚠ 직원 데이터 없음 — 인사앱 GAS URL을 확인해 주세요</div>`;
  } else {
    html += `<div style="font-size:12px;color:var(--text3);margin-bottom:.5rem">직원 ${S.employees.length}명 로딩됨</div>`;
    S.employees.forEach(e => {
      const hist = S.payHistory[e.id] || [];
      const rec = hist.find(h => String(h.month || h.ym || h.mo || '') === String(ym));
      html += `<div style="border:1px solid var(--border);border-radius:10px;padding:.75rem;margin-bottom:8px"><div style="font-weight:700;margin-bottom:.4rem">${e.name} (${e.role||''})</div>`;
      if (rec) {
        html += `<div style="background:#dcf0e6;border-radius:6px;padding:.5rem .75rem;font-size:12px;margin-bottom:.4rem;color:var(--green)">✅ ${ymLabel} 급여이력 있음 (인사앱 저장)</div>
          <table style="width:100%;font-size:12px;border-collapse:collapse">
            <tr><td style="color:var(--text3);padding:.2rem .4rem">포괄/기본급</td><td style="text-align:right;font-weight:600">${won(rec.base||0)}</td></tr>
            <tr><td style="color:var(--text3);padding:.2rem .4rem">연장수당</td><td style="text-align:right;color:var(--blue)">${won(rec.ext||0)}</td></tr>
            <tr><td style="color:var(--text3);padding:.2rem .4rem">야간수당</td><td style="text-align:right;color:var(--blue)">${won(rec.night||0)}</td></tr>
            <tr><td style="color:var(--text3);padding:.2rem .4rem">휴일수당</td><td style="text-align:right;color:var(--blue)">${won(rec.hol||0)}</td></tr>
            <tr><td style="color:var(--text3);padding:.2rem .4rem">식대</td><td style="text-align:right">${won(rec.meal||0)}</td></tr>
            <tr><td style="color:var(--text3);padding:.2rem .4rem">결근공제</td><td style="text-align:right;color:var(--red)">-${won(rec.absDeduct||0)} (${rec.absDays||0}일)</td></tr>
            <tr style="border-top:2px solid var(--border)"><td style="padding:.3rem .4rem;font-weight:700">실지급 (gross)</td><td style="text-align:right;font-weight:700;font-size:14px;color:var(--brown)">${won(rec.gross||0)}</td></tr>
            <tr><td style="color:var(--text3);padding:.2rem .4rem;font-size:11px">저장시각</td><td style="text-align:right;font-size:11px;color:var(--text3)">${rec.savedAt ? rec.savedAt.slice(0,16).replace('T',' ') : '—'}</td></tr>
          </table>`;
      } else {
        const calc = calcGrossFromData(e, ym);
        html += `<div style="background:#ddeaf8;border-radius:6px;padding:.5rem .75rem;font-size:12px;margin-bottom:.4rem;color:var(--blue)">🔢 급여이력 없음 → 연장·결근 데이터로 직접 계산</div>
          <table style="width:100%;font-size:12px;border-collapse:collapse">
            <tr><td style="color:var(--text3);padding:.2rem .4rem">포괄임금</td><td style="text-align:right;font-weight:600">${won(Number(e.totalPay||e.base||0))}</td></tr>
            <tr><td style="color:var(--text3);padding:.2rem .4rem">연장수당 (${calc.extH}h)</td><td style="text-align:right;color:var(--blue)">${won(calc.extPay)}</td></tr>
            <tr><td style="color:var(--text3);padding:.2rem .4rem">야간수당 (${calc.nightH}h)</td><td style="text-align:right;color:var(--blue)">${won(calc.nightPay)}</td></tr>
            <tr><td style="color:var(--text3);padding:.2rem .4rem">휴일수당 (${calc.holH}h)</td><td style="text-align:right;color:var(--blue)">${won(calc.holPay)}</td></tr>
            <tr><td style="color:var(--text3);padding:.2rem .4rem">식대</td><td style="text-align:right">${won(calc.meal)}</td></tr>
            <tr><td style="color:var(--text3);padding:.2rem .4rem">결근공제 (${calc.absDays}일)</td><td style="text-align:right;color:var(--red)">-${won(calc.absDeduct)}</td></tr>
            <tr style="border-top:2px solid var(--border)"><td style="padding:.3rem .4rem;font-weight:700">계산된 지급액</td><td style="text-align:right;font-weight:700;font-size:14px;color:var(--brown)">${won(calc.gross)}</td></tr>
          </table>
          <div style="font-size:10px;color:var(--text3);margin-top:.3rem">* 주휴수당 박탈·수습비율 등 일부 미반영 — 참고용</div>`;

    const phKeys = Object.keys(S.payHistory);
    html += `<div style="font-size:11px;color:var(--text3);margin-top:.5rem">payHistory 보유 직원 ID: ${phKeys.length ? phKeys.join(', ') : '없음'}</div>`;
  }
  openModal(`🔍 인건비 진단 — ${ymLabel}`, html, [
    { label: '데이터 새로고침 후 재확인', cls: 'pri', fn: () => { closeModal(); loadAllData(); setTimeout(()=>diagLaborCost(), 2000); }},
    { label: '닫기', cls: '', fn: closeModal }
  ]);
}

function renderPendingTasks() {
  const pending = [];
  for (const m of S.meetings) {
    for (const t of (m.tasks || [])) { if (!t.done) pending.push({ ...t, meetingTitle: m.title }); }
  }
  if (!pending.length) return '<div style="font-size:13px;color:var(--text3);padding:.5rem 0">미완료 과제 없음</div>';
  const now = new Date();
  return pending.slice(0, 4).map(t => {
    const over = t.dueDate && new Date(t.dueDate) < now;
    return `<div class="task-item"><div class="task-chk ${over ? 'over' : ''}">${over ? '!' : ''}</div><div class="task-content"><div class="task-title">${t.content}</div><div class="task-meta">${t.assignee || ''} · ${t.dueDate || ''} ${over ? '<span style="color:var(--red)">기한 초과</span>' : ''}</div></div></div>`;
  }).join('');
}

function renderTrend() {
  const months = getLast12Months();
  const revenues = months.map(m => monthRevenue(m));
  const purchases = months.map(m => monthPurchase(m));
  const maxRev = Math.max(...revenues, 1);
  const ym = currentYM();
  const bars = months.map((m, i) => {
    const h = Math.round(revenues[i] / maxRev * 88);
    const label = m.slice(5) + '월';
    const isCur = m === ym;
    return `<div class="bar-wrap"><div class="bar ${isCur ? 'cur' : ''}" style="height:${h}px" data-tip="${label} ${won(revenues[i])}"></div><span class="bar-label">${label}</span></div>`;
  }).join('');
  const recentMonths = months.slice(-6);
  const chTableHeader = `<tr><th style="text-align:left;padding:.4rem .6rem;font-size:12px;color:var(--text3)">월</th><th style="padding:.4rem .6rem;font-size:12px;color:var(--text3)">개인</th><th style="padding:.4rem .6rem;font-size:12px;color:var(--text3)">장례</th><th style="padding:.4rem .6rem;font-size:12px;color:var(--text3)">웨딩</th><th style="padding:.4rem .6rem;font-size:12px;color:var(--text3)">기타</th><th style="padding:.4rem .6rem;font-size:12px;color:var(--text3)">합계</th></tr>`;
  const chTableRows = recentMonths.map(m => {
    const mOrders = monthOrders(m);
    const chRev = { 개인: 0, 장례: 0, 웨딩: 0, 기타: 0 };
    mOrders.forEach(o => { chRev[o.ch] = (chRev[o.ch]||0) + Number(o.priceTotal||0); });
    const total = Object.values(chRev).reduce((a,b)=>a+b,0);
    const isCur = m === ym;
    return `<tr style="${isCur ? 'background:var(--brown3);font-weight:700' : ''}">
      <td style="padding:.4rem .6rem;font-size:13px">${m.slice(5)}월</td>
      ${['개인','장례','웨딩','기타'].map(ch => `<td style="padding:.4rem .6rem;font-size:12px;text-align:right">${chRev[ch] > 0 ? (chRev[ch]/10000).toFixed(0)+'만' : '—'}</td>`).join('')}
      <td style="padding:.4rem .6rem;font-size:12px;text-align:right;font-weight:700">${(total/10000).toFixed(0)}만</td>
    </tr>`;
  }).join('');

  document.getElementById('trendContent').innerHTML = `
    <div class="card">
      <div class="card-title">월별 매출 추이 (최근 12개월)</div>
      <div class="bar-chart">${bars}</div>
    </div>
    <div class="card">
      <div class="card-title">채널별 매출 (최근 6개월, 만원)</div>
      <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse"><thead>${chTableHeader}</thead><tbody>${chTableRows}</tbody></table></div>
    </div>
    <div class="card">
      <div class="card-title" style="display:flex;justify-content:space-between;align-items:center">
        <span>채널 매출 추이 (최근 6개월)</span>
        <button class="btn sm" onclick="openChannelSalesModal(currentYM())" style="font-size:11px">📱 입력</button>
      </div>
      <div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse">
        <thead><tr>
          ${months.slice(-6).map(m=>`<th style="padding:.4rem .6rem;font-size:11px;color:var(--text3)">${m.slice(5)}월</th>`).join('')}
        </tr></thead>
        <tbody>
          <tr style="border-bottom:1px solid var(--border)">
            ${months.slice(-6).map(m=>{const cs=S.channelSales[m]||{};const pos=Number(cs.pos)||0;return `<td style="padding:.3rem .6rem;font-size:11px;text-align:center;color:var(--text3)">${pos>0?(pos/10000).toFixed(0)+'만':'—'}</td>`;}).join('')}
          </tr>
          <tr>
            ${months.slice(-6).map(m=>{const ch=monthChannelRevenue(m);return `<td style="padding:.3rem .6rem;font-size:12px;text-align:center;font-weight:${ch>0?'700':'400'};color:${ch>0?'var(--brown)':'var(--text3)'}">${ch>0?(ch/10000).toFixed(0)+'만':'—'}</td>`;}).join('')}
          </tr>
        </tbody>
        <tfoot><tr style="background:var(--brown3)">
          ${months.slice(-6).map(m=>{const total=monthChannelRevenue(m);return `<td style="padding:.4rem .6rem;font-size:11px;text-align:center;font-weight:700;color:var(--brown)">${total>0?'합 '+(total/10000).toFixed(0)+'만':'—'}</td>`;}).join('')}
        </tr></tfoot>
      </table></div>
      <div style="display:flex;gap:12px;font-size:11px;color:var(--text3);margin-top:6px">
        <span>위: POS 매장매출</span><span>아래: 전체 채널합계 (POS+온라인)</span>
      </div>
    </div>
    <div class="card">
      <div class="card-title">매입비 추이 (최근 6개월)</div>
      ${purchases.some(p=>p>0) ?
        `<div style="overflow-x:auto"><table style="width:100%;border-collapse:collapse">
          <thead><tr>${months.slice(-6).map(m=>`<th style="padding:.4rem .6rem;font-size:11px;color:var(--text3)">${m.slice(5)}월</th>`).join('')}</tr></thead>
          <tbody><tr>${months.slice(-6).map((_,i)=>`<td style="padding:.4rem .6rem;font-size:12px;text-align:center">${purchases[i+6]>0?(purchases[i+6]/10000).toFixed(0)+'만':'—'}</td>`).join('')}</tr></tbody>
        </table></div>` :
        '<div style="font-size:13px;color:var(--text3);padding:.5rem 0">장부앱 매입탭에 데이터를 입력하면 표시됩니다</div>'
      }
    </div>
  `;
}

let MS = { mid: null, step: 0 };
const STEPS = [
  { key:'revenue',  icon:'💰', label:'매출 현황' },
  { key:'purchase', icon:'🛒', label:'매입 현황' },
  { key:'tasks',    icon:'✅', label:'지난 과제 점검' },
  { key:'decision', icon:'📝', label:'안건 · 결정사항' },
  { key:'target',   icon:'🎯', label:'다음달 목표' },
  { key:'done',     icon:'🎉', label:'회의 마무리' }
];

function renderMeeting() {
  const el = document.getElementById('meetingContent');
  if (!el) return;
  if (MS.mid) { renderMeetingSession(); } else { renderMeetingList(); }
}

function renderMeetingList() {
  const el = document.getElementById('meetingContent');
  el.innerHTML = `
    <div class="meeting-header">
      <div class="meeting-title">📋 회의록</div>
      <button class="btn pri" onclick="openNewMeeting()">+ 새 회의 시작</button>
    </div>
    <div class="card">
      <div class="card-title">회의록 목록</div>
      ${S.meetings.length ? S.meetings.slice().reverse().map(m => {
        const done = (m.tasks||[]).filter(t=>t.done).length;
        const total = (m.tasks||[]).length;
        const pending = total - done;
        return `<div style="display:flex;align-items:center;justify-content:space-between;padding:.7rem 0;border-bottom:1px solid var(--border)">
          <div><div style="font-size:14px;font-weight:700">${m.title}</div><div style="font-size:11px;color:var(--text3);margin-top:2px">${m.date} · ${m.members||''}${pending>0?` · <span style="color:var(--red)">미완료 ${pending}건</span>`:' · 과제완료'}</div></div>
          <div style="display:flex;gap:6px"><button class="btn sm pri" onclick="resumeMeeting('${m.id}')">진행</button><button class="btn sm" onclick="shareMeeting('${m.id}')">공유</button></div>
        </div>`;
      }).join('') : '<div style="font-size:13px;color:var(--text3);padding:1rem 0;text-align:center">아직 회의록이 없습니다<br><br><button class="btn pri" onclick="openNewMeeting()">첫 회의 시작하기</button></div>'}
    </div>
  `;
}

function resumeMeeting(id) { MS.mid = id; MS.step = 0; renderMeetingSession(); }

function renderMeetingSession() {
  const el = document.getElementById('meetingContent');
  const m = S.meetings.find(x => x.id === MS.mid);
  if (!m) { MS.mid = null; renderMeetingList(); return; }
  const step = STEPS[MS.step];
  const stepBar = STEPS.map((s, i) => `
    <div onclick="MS.step=${i};renderMeetingSession()" style="display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;flex:1">
      <div style="width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;
        background:${i===MS.step?'var(--brown)':i<MS.step?'var(--green)':'var(--surface2)'};
        color:${i<=MS.step?'#fff':'var(--text3)'};
        border:${i===MS.step?'2px solid var(--brown)':'2px solid transparent'};
        transition:all .2s">${i<MS.step?'✓':s.icon}</div>
      <div style="font-size:9px;color:${i===MS.step?'var(--brown)':i<MS.step?'var(--green)':'var(--text3)'};font-weight:${i===MS.step?'700':'400'};text-align:center;line-height:1.2">${s.label}</div>
    </div>`).join('');
  el.innerHTML = `
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem">
      <div><div style="font-size:16px;font-weight:700;font-family:'Noto Serif KR',serif">${m.title}</div><div style="font-size:11px;color:var(--text3)">${m.date} · ${m.members||''}</div></div>
      <button class="btn sm" onclick="MS.mid=null;renderMeetingList()">목록으로</button>
    </div>
    <div style="display:flex;gap:4px;margin-bottom:1.25rem;padding:.75rem;background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow-x:auto">${stepBar}</div>
    <div id="stepContent"></div>
    <div style="display:flex;gap:8px;margin-top:1rem">
      ${MS.step > 0 ? `<button class="btn" onclick="MS.step--;renderMeetingSession()">◀ 이전</button>` : ''}
      ${MS.step < STEPS.length-1 ? `<button class="btn pri" style="margin-left:auto" onclick="MS.step++;renderMeetingSession()">다음 ▶</button>` : ''}
    </div>
  `;
  renderStep(m, step.key);
}

function renderStep(m, key) {
  const el = document.getElementById('stepContent');
  const ym = m.autoData?.ym || (S.selectedYM || prevYM_real());
  const [y, mo] = ym.split('-');
  const ymLabel = `${y}년 ${parseInt(mo)}월`;

  if (key === 'revenue') {
    const mOrders = monthOrders(ym);
    const chList = [
      { key:'장례', label:'장례식장', nameField:'funeralName', orders: S.funeralOrders },
      { key:'웨딩', label:'웨딩홀',   nameField:'weddingName', orders: S.weddingOrders },
      { key:'기타', label:'기타업체', nameField:'venueName',   orders: S.otherOrders },
      { key:'개인', label:'개인',     nameField:'receiverName',orders: S.orders }
    ];
    const totalRev = mOrders.reduce((s,o)=>s+Number(o.priceTotal||0),0);
    const prevRevVal = monthRevenue(prevYM());
    const chCards = chList.map(ch => {
      const chOrd = ch.orders.filter(o => { const d = normalizeDate(o.deliveryDate || o.createdAt || ''); return d && d.startsWith(ym) && o.payStatus !== '대기'; });
      const chTotal = chOrd.reduce((s,o)=>s+Number(o.priceTotal||0),0);
      if (chTotal === 0 && chOrd.length === 0) return '';
      const byVenue = {};
      chOrd.forEach(o => { const vname = o[ch.nameField] || '미지정'; if (!byVenue[vname]) byVenue[vname] = { cnt:0, total:0 }; byVenue[vname].cnt++; byVenue[vname].total += Number(o.priceTotal||0); });
      const venueRows = Object.entries(byVenue).sort((a,b)=>b[1].total-a[1].total)
        .map(([name,v]) => `<div style="display:flex;justify-content:space-between;align-items:center;padding:.35rem .75rem;font-size:12px;border-bottom:1px solid var(--border)"><span style="color:var(--text2)">${name}</span><span><strong>${won(v.total)}</strong> <span style="color:var(--text3)">(${v.cnt}건)</span></span></div>`).join('');
      return `<div class="card" style="margin-bottom:8px;padding:0;overflow:hidden">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:.75rem 1rem;cursor:pointer;background:var(--surface)" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'">
          <div style="display:flex;align-items:center;gap:10px"><div style="font-size:15px;font-weight:700">${ch.label}</div><span style="font-size:12px;color:var(--text3)">${chOrd.length}건</span></div>
          <div style="display:flex;align-items:center;gap:8px"><strong style="font-size:16px">${won(chTotal)}</strong><span style="font-size:12px;color:var(--text3)">${totalRev>0?(chTotal/totalRev*100).toFixed(0)+'%':''}</span><span style="color:var(--text3);font-size:12px">▼</span></div>
        </div>
        <div style="display:none;border-top:1px solid var(--border)">${venueRows||'<div style="padding:.5rem .75rem;font-size:12px;color:var(--text3)">상세 데이터 없음</div>'}</div>
      </div>`;
    }).join('');
    el.innerHTML = `
      <div style="background:var(--brown3);border-radius:12px;padding:1rem 1.2rem;margin-bottom:.75rem">
        <div style="font-size:12px;color:var(--brown);font-weight:700;margin-bottom:.3rem">${ymLabel} 총 매출</div>
        <div style="font-size:32px;font-weight:700;font-family:'Noto Serif KR',serif">${won(totalRev)}</div>
        <div style="font-size:13px;color:var(--text2);margin-top:.3rem">${diffBadge(totalRev,prevRevVal)} 전달 ${won(prevRevVal)}</div>
      </div>
      <div style="font-size:12px;color:var(--text3);margin-bottom:.5rem">▼ 클릭하면 거래처별 상세 확인</div>
      ${chCards}`;

  } else if (key === 'purchase') {
    // ★ 수정: 장부앱 + 엑셀 과거 데이터 합산
    const purMonth = [...S.purchases, ...S.importedPurchases].filter(p => getYM(p.date) === ym);
    const purTotal = purMonth.reduce((s,p)=>s+Number(p.amount||0),0);
    const mRevenue = m.autoData?.revenue || monthRevenue(ym);
    const byPartner = {};
    purMonth.forEach(p => { const name = p.partner || '미지정'; if (!byPartner[name]) byPartner[name] = { total:0, items:[] }; byPartner[name].total += Number(p.amount||0); byPartner[name].items.push(p); });
    const byType = {};
    purMonth.forEach(p => { const t = p.type || '기타'; byType[t] = (byType[t]||0) + Number(p.amount||0); });
    const partnerRows = Object.entries(byPartner).sort((a,b)=>b[1].total-a[1].total).map(([name,v]) => {
      const itemList = v.items.map(i=>`<div style="padding:.25rem .9rem;font-size:11px;color:var(--text3);display:flex;justify-content:space-between"><span>${i.item||'—'} ${i.type?`(${i.type})`:''}</span><span>${won(i.amount)}</span></div>`).join('');
      return `<div class="card" style="margin-bottom:6px;padding:0;overflow:hidden">
        <div style="display:flex;justify-content:space-between;align-items:center;padding:.65rem 1rem;cursor:pointer" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='none'?'block':'none'">
          <span style="font-size:13px;font-weight:700">${name}</span>
          <div style="display:flex;align-items:center;gap:8px"><strong>${won(v.total)}</strong><span style="color:var(--text3);font-size:12px">▼</span></div>
        </div>
        <div style="display:none;border-top:1px solid var(--border)">${itemList}</div>
      </div>`;
    }).join('');
    const typeRows = Object.entries(byType).sort((a,b)=>b[1]-a[1]).map(([t,v]) =>
      `<div style="display:flex;justify-content:space-between;font-size:13px;padding:.3rem 0;border-bottom:1px solid var(--border)"><span style="color:var(--text2)">${t}</span><strong>${won(v)}</strong></div>`).join('');
    el.innerHTML = `
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:.75rem">
        <div style="background:#fde8e6;border-radius:12px;padding:.85rem 1rem">
          <div style="font-size:11px;color:var(--red);font-weight:700;margin-bottom:.2rem">${ymLabel} 총 매입</div>
          <div style="font-size:26px;font-weight:700;color:var(--red)">${won(purTotal)}</div>
        </div>
        <div style="background:var(--surface2);border:1px solid var(--border);border-radius:12px;padding:.85rem 1rem">
          <div style="font-size:11px;color:var(--text3);font-weight:700;margin-bottom:.2rem">매출 대비 매입 비율</div>
          <div style="font-size:26px;font-weight:700">${mRevenue>0?(purTotal/mRevenue*100).toFixed(1)+'%':'—'}</div>
          <div style="font-size:11px;color:var(--text3);margin-top:2px">매출 ${won(mRevenue)}</div>
        </div>
      </div>
      ${purTotal === 0 ? `<div class="data-gap-alert"><strong>매입 데이터가 없습니다</strong>장부앱 매입탭에 입력해 주세요</div>` : ''}
      ${byType && Object.keys(byType).length ? `<div class="card" style="margin-bottom:.75rem"><div class="card-title">분류별</div>${typeRows}</div>` : ''}
      <div style="font-size:12px;color:var(--text3);margin-bottom:.5rem">▼ 거래처별 상세 (클릭)</div>
      ${partnerRows || '<div style="font-size:13px;color:var(--text3)">거래처 데이터 없음</div>'}`;

  } else if (key === 'tasks') {
    const allPending = [];
    for (const mtg of S.meetings) {
      if (mtg.id === m.id) continue;
      for (const t of (mtg.tasks||[])) { if (!t.done) allPending.push({ ...t, mid: mtg.id, meetingTitle: mtg.title }); }
    }
    const now = new Date();
    el.innerHTML = `
      <div style="font-size:14px;font-weight:700;margin-bottom:.75rem">이전 회의 미완료 과제 ${allPending.length ? `<span style="color:var(--red)">${allPending.length}건</span>` : '<span style="color:var(--green)">없음 ✓</span>'}</div>
      ${allPending.length ? allPending.map(t => {
        const over = t.dueDate && new Date(t.dueDate) < now;
        return `<div class="task-item">
          <div class="task-chk ${over?'over':''}" onclick="toggleTask('${t.mid}','${t.id}');renderMeetingSession()">${over?'!':''}</div>
          <div class="task-content"><div class="task-title">${t.content}</div><div class="task-meta">${t.assignee||''} · ${t.dueDate||''} · <span style="color:var(--text3)">${t.meetingTitle}</span> ${over?'<span style="color:var(--red)">기한초과</span>':''}</div></div>
          <button class="btn sm green" onclick="toggleTask('${t.mid}','${t.id}');renderMeetingSession()">완료</button>
        </div>`;
      }).join('') : '<div style="text-align:center;padding:2rem;color:var(--green);font-size:15px;font-weight:700">👍 모든 과제 완료</div>'}`;

  } else if (key === 'decision') {
    const decHTML = (m.decisions||[]).map(d => `
      <div class="decision-card">
        <div style="display:flex;justify-content:space-between;align-items:flex-start"><div style="flex:1">
          <div class="decision-agenda">${d.agenda}</div>
          <div class="decision-content">${d.content||'—'}</div>
          <div class="decision-assign">${d.assignee?`<span class="assign-chip">👤 ${d.assignee}</span>`:''}${d.dueDate?`<span class="date-chip">📅 ${d.dueDate}</span>`:''}</div>
        </div></div>
      </div>`).join('') || '<div style="font-size:13px;color:var(--text3);padding:.5rem 0">아직 안건이 없습니다</div>';
    const taskHTML = (m.tasks||[]).map(t => `
      <div class="task-item">
        <div class="task-chk ${t.done?'done':''}" onclick="toggleTask('${m.id}','${t.id}');renderMeetingSession()">${t.done?'✓':''}</div>
        <div class="task-content"><div class="task-title">${t.content}</div><div class="task-meta">${t.assignee||''} ${t.dueDate?'· '+t.dueDate:''}</div></div>
      </div>`).join('') || '<div style="font-size:13px;color:var(--text3)">과제 없음</div>';
    el.innerHTML = `
      <div style="margin-bottom:.75rem"><div style="font-size:14px;font-weight:700;margin-bottom:.5rem">안건 · 결정사항</div>${decHTML}<button class="btn sm" style="margin-top:.4rem" onclick="addDecision('${m.id}')">+ 안건 추가</button></div>
      <div style="margin-top:1rem"><div style="font-size:14px;font-weight:700;margin-bottom:.5rem">과제 목록</div>${taskHTML}<button class="btn sm" style="margin-top:.4rem" onclick="addTask('${m.id}')">+ 과제 추가</button></div>`;

  } else if (key === 'target') {
    el.innerHTML = `
      <div style="font-size:14px;font-weight:700;margin-bottom:.5rem">🎯 다음달 목표</div>
      <textarea id="mv_targets" placeholder="다음달 매출 목표, 중점 과제 등을 입력하세요" style="min-height:120px">${m.nextTargets||''}</textarea>
      <button class="btn pri sm" style="margin-top:.5rem" onclick="saveTargets('${m.id}')">저장</button>`;

  } else if (key === 'done') {
    const totalDec = (m.decisions||[]).length;
    const totalTask = (m.tasks||[]).length;
    el.innerHTML = `
      <div style="text-align:center;padding:1rem 0">
        <div style="font-size:40px;margin-bottom:.75rem">🎉</div>
        <div style="font-family:'Noto Serif KR',serif;font-size:20px;font-weight:700;margin-bottom:.5rem">${m.title} 완료</div>
        <div style="font-size:13px;color:var(--text3);margin-bottom:1.5rem">${m.date} · ${m.members||''}</div>
        <div style="display:flex;gap:8px;justify-content:center;margin-bottom:1.5rem">
          <div style="background:var(--surface2);border-radius:10px;padding:.6rem 1.2rem;text-align:center"><div style="font-size:20px;font-weight:700">${totalDec}</div><div style="font-size:11px;color:var(--text3)">결정사항</div></div>
          <div style="background:var(--surface2);border-radius:10px;padding:.6rem 1.2rem;text-align:center"><div style="font-size:20px;font-weight:700">${totalTask}</div><div style="font-size:11px;color:var(--text3)">과제</div></div>
        </div>
        <div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
          <button class="btn green" onclick="shareMeeting('${m.id}')">📤 직원 공유하기</button>

function createMeeting() {
  const title = document.getElementById('mt_title').value.trim();
  const date = document.getElementById('mt_date').value;
  const members = document.getElementById('mt_members').value.trim();
  if (!title) { toast('제목을 입력해 주세요'); return; }
  const ym = S.selectedYM || prevYM_real();
  const pym = prevYM();
  const m = {
    id: 'mtg_' + Date.now(), title, date, members,
    autoData: { ym: ym, revenue: monthRevenue(ym), prevRevenue: monthRevenue(pym), purchase: monthPurchase(ym), labor: (monthLaborCost(ym)||{}).total || 0 },
    decisions: [], tasks: [], nextTargets: '', createdAt: new Date().toISOString()
  };
  S.meetings.push(m);
  saveMeetings();
  closeModal();
  resumeMeeting(m.id);
}

    <div style="font-size:12px;color:var(--text3);margin-bottom:.4rem">빠른 질문:</div>
    <div class="ai-suggestion">
      <button class="ai-sug-btn" onclick="askAI('이번 달 경영 상황을 분석해줘')">이번달 총평</button>
      <button class="ai-sug-btn" onclick="askAI('경영노트를 바탕으로 지금 가장 중요한 과제가 뭐야?')">핵심 과제</button>
      <button class="ai-sug-btn" onclick="askAI('이번달 회의 준비 핵심 3가지를 알려줘')">회의 브리핑</button>
      <button class="ai-sug-btn" onclick="askAI('신제품 개발이나 사업 계획 관련해서 조언해줘')">사업 조언</button>
      <button class="ai-sug-btn" onclick="askAI('원가율 분석해줘')">원가 분석</button>
    </div>
    <div class="ai-chat" id="aiChat">${renderAIMessages()}</div>
    <div class="ai-input-row">
      <input type="text" id="aiInput" placeholder="무엇이든 물어보세요. 경영노트 내용도 참고해서 답해드려요." onkeydown="if(event.key==='Enter')sendAI()">
      <button class="btn pri" onclick="sendAI()">전송</button>
    </div>`;
}

function renderAIMessages() {
  if (!aiMessages.length) return '<div style="text-align:center;padding:1.5rem;color:var(--text3);font-size:13px">경영노트를 기반으로 맞춤 분석을 도와드립니다<br><span style="font-size:11px">지원사업, 신제품 계획, 거래처 전략 등을 노트에 기록해 두세요</span></div>';
  return aiMessages.map((m, i) => {
    const isLastAssistant = m.role === 'assistant' && i === aiMessages.length - 1;
    return `<div class="ai-msg ${m.role}">${m.content.replace(/\n/g,'<br>')}${
      isLastAssistant ? `<div style="margin-top:.6rem;padding-top:.5rem;border-top:1px solid rgba(0,0,0,.1);display:flex;gap:6px;flex-wrap:wrap">
        <button style="padding:3px 10px;border-radius:12px;border:1px solid #c4b5fd;background:#ede9fe;color:#6b21a8;font-size:11px;cursor:pointer;font-weight:600" onclick="saveNoteFromAI(\`${m.content.replace(/`/g,"'").slice(0,500)}\`)">📓 경영노트에 저장</button>
      </div>` : ''
    }</div>`;
  }).join('');
}

function clearAIChat() { aiMessages = []; renderAI(); }
function askAI(q) { document.getElementById('aiInput').value = q; sendAI(); }

async function sendAI() {
  const input = document.getElementById('aiInput');
  const q = input.value.trim();
  if (!q) return;
  input.value = '';
  if (!S.apiKey) { toast('설정에서 API 키를 먼저 입력해 주세요'); showPanel('settings'); return; }
  aiMessages.push({ role: 'user', content: q });
  updateAIChat();
  const loadingId = 'ai_loading_' + Date.now();
  const chatEl = document.getElementById('aiChat');
  if (chatEl) { chatEl.insertAdjacentHTML('beforeend', `<div class="ai-msg assistant thinking" id="${loadingId}">분석 중...</div>`); chatEl.scrollTop = chatEl.scrollHeight; }
  try {
    const ym = currentYM();
    const rev = monthRevenue(ym);
    const pym = prevYM();
    const prevRev = monthRevenue(pym);
    const pur = monthPurchase(ym);
    const laborR = monthLaborCost(ym);
    const laborEst = laborR ? laborR.total : 0;
    const laborIsEstimate = laborR ? laborR.source !== 'history' : true;
    const totalCost = pur + laborEst;
    const products = parseProducts(monthOrders(ym));
    const chOrders = monthOrders(ym);
    const chRev = { 개인:0, 장례:0, 웨딩:0, 기타:0 };
    chOrders.forEach(o => { chRev[o.ch] = (chRev[o.ch]||0) + Number(o.priceTotal||0); });
    const months6 = getLast12Months().slice(-6);
    const trend = months6.map(m => `${m.slice(5)}월: ${(monthRevenue(m)/10000).toFixed(0)}만원`).join(', ');
    const memoSummary = S.memos.slice(-5).map(m => `[${m.date}/${m.tag}] ${m.text}`).join('\n') || '없음';
    const empDetail = S.employees.length ? S.employees.map(e => { const { pay, source } = empMonthPay(e, ym); const lbl = source === 'history' ? '실지급' : source === 'calc' ? '계산(연장·결근반영)' : '계약액'; return `  - ${e.name}(${e.role||'직원'}): ${lbl} ${won(pay)}`; }).join('\n') : '  인사앱 미연동';
    let attendSummary = '데이터 없음';
    if (S.employees.length) {
      let totalAbs = 0, totalOT = 0;
      S.employees.forEach(e => { const otMonth = (S.otAll||{})[e.id]?.[ym] || {}; Object.values(otMonth).forEach(d => { totalOT += Number(d.ext||0) + Number(d.night||0); }); const absMonth = (S.absence||{})[e.id]?.[ym] || {}; Object.values(absMonth).forEach(v => { totalAbs += Number(v||0); }); });
      attendSummary = `결근 ${totalAbs}일, 연장·야간근무 ${totalOT.toFixed(1)}h`;
    }
    // ★ 수정: 합산 데이터로 AI 프롬프트 구성
    const allPurMonth = [...S.purchases, ...S.importedPurchases].filter(p=>getYM(p.date)===ym);
    const purByPartner = {};
    allPurMonth.forEach(p=>{ const n=p.partner||'미지정'; purByPartner[n]=(purByPartner[n]||0)+Number(p.amount||0); });
    const purDetail = Object.entries(purByPartner).length ? Object.entries(purByPartner).map(([n,v])=>`  - ${n}: ${won(v)}`).join('\n') : '  데이터 없음';
    const systemPrompt = `당신은 한국 전통 떡 제조업체 "남씨네 떡집"의 전담 경영 AI 어시스턴트입니다.
대전 중구 대사동 위치, 3대째 운영, 직원 ${S.employees.length||5}명, 장례식장·웨딩홀·개인·기타 채널 운영.

=== 사장님 경영노트 (중요 — 반드시 참고) ===
${buildNoteContext()}

=== ${ym} 경영 데이터 ===

[매출]
- 총 매출: ${won(rev)} (전달 ${won(prevRev)}, ${prevRev>0?((rev-prevRev)/prevRev*100).toFixed(1)+'% 변동':'전달 데이터 없음'})
- 장례식장: ${won(chRev.장례)} / 웨딩홀: ${won(chRev.웨딩)} / 개인: ${won(chRev.개인)} / 기타: ${won(chRev.기타)}
- 최근 6개월 추이: ${trend}

[비용]
- 원재료비(매입): ${pur>0?won(pur):'데이터 없음'}
- 인건비 합계: ${laborEst>0?won(laborEst)+(laborIsEstimate?' (계약액 추정)':''):'데이터 없음'}
- 총 비용: ${totalCost>0?won(totalCost):'일부 미집계'}
- 원가율: ${rev>0&&totalCost>0?(totalCost/rev*100).toFixed(1)+'%':'계산 불가'}

[매입 거래처별]
${purDetail}

[직원 현황 (${S.employees.length}명)]
${empDetail}
- 이달 근태 요약: ${attendSummary}

[상품]
- 인기 상품: ${products.slice(0,5).map(([n,c])=>n+'('+c+'건)').join(', ')||'데이터 부족'}

[특이사항 메모]
${memoSummary}

=== 분석 지침 ===
- 경영노트에 기록된 사업 계획, 신제품 개발, 지원사업 등의 맥락을 항상 반영해서 답하세요
- 노트에 없는 새로운 중요 결정이나 계획을 사장님이 언급하면 "경영노트에 저장해 두시면 다음에도 참고할게요"라고 제안하세요
- 데이터가 없는 항목은 솔직하게 말하고 수집 방법을 제안하세요
- 답변은 핵심만 간결하게, 한국어로, 수치 인용 시 구체적으로`;
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'x-api-key': S.apiKey, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
      body: JSON.stringify({ model: 'claude-sonnet-4-20250514', max_tokens: 1000, system: systemPrompt, messages: aiMessages.map(m => ({ role: m.role, content: m.content })) })
    });
    const data = await response.json();
    const answer = data.content?.[0]?.text || '응답을 받지 못했습니다.';
    document.getElementById(loadingId)?.remove();
    aiMessages.push({ role: 'assistant', content: answer });
    saveAIChatHistory();
    updateAIChat();
  } catch(e) {
    document.getElementById(loadingId)?.remove();
    const msg = e.message||'';
    const errText = msg.includes('Failed to fetch') || msg.includes('NetworkError') ? 'API 연결 실패\n\n브라우저에서 직접 API 호출이 차단될 수 있습니다.\nGAS 프록시 설정이 필요합니다.' : 'API 오류가 발생했습니다. API 키를 확인해 주세요.\n(' + msg + ')';
    aiMessages.push({ role: 'assistant', content: errText });
    updateAIChat();
  }
}

function updateAIChat() {
  const el = document.getElementById('aiChat');
  if (!el) return;
  el.innerHTML = renderAIMessages();
  el.scrollTop = el.scrollHeight;
}

function openModal(title, body, actions) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = body;
  const actEl = document.getElementById('modalActions');
  actEl.innerHTML = (actions || []).map(a => `<button class="btn ${a.cls||''}" onclick="(${a.fn.toString()})()">${a.label}</button>`).join('');
  document.getElementById('overlay').style.display = 'flex';
}

function closeModal() { document.getElementById('overlay').style.display = 'none'; }

function showPanel(id) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.getElementById('panel-' + id)?.classList.add('active');
  document.querySelectorAll('.nb').forEach(b => b.classList.remove('active'));
  const panels = ['dash','trend','meeting','note','ai','memo','settings'];
  const idx = panels.indexOf(id);
  document.querySelectorAll('.nb')[idx]?.classList.add('active');
  S.currentPanel = id;
  if (id === 'dash' && S.dataLoaded) renderDash();
  if (id === 'trend' && S.dataLoaded) renderTrend();
  if (id === 'meeting') renderMeeting();
  if (id === 'note') renderNote();
  if (id === 'ai') renderAI();
  if (id === 'memo') renderMemo();
}

function ls(k) { try { return localStorage.getItem('boss_' + k); } catch(e) { return null; } }
function setLs(k, v) { try { localStorage.setItem('boss_' + k, v); } catch(e) {} }
function toast(msg, dur=2000) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), dur);
}

init();
</script>
</body>
</html>
