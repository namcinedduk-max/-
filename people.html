<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https://script.google.com https://script.googleusercontent.com https://unpkg.com https://apis.data.go.kr;">
<title>남씨네전통식품 인사관리</title>
<script src="https://unpkg.com/docx@9.0.3/build/index.umd.js"></script>
<script src="https://unpkg.com/exceljs/dist/exceljs.min.js"></script>
<style>

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans KR',sans-serif;background:#f5f4f0;color:#1a1a1a;font-size:15px}
.app{max-width:980px;margin:0 auto;padding:1.5rem 1rem}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;flex-wrap:wrap;gap:10px}
.app-title{font-size:20px;font-weight:700}
.top-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sync-bar{display:flex;align-items:center;gap:7px}
.sync-dot{width:9px;height:9px;border-radius:50%;background:#22c55e;flex-shrink:0}
.sync-dot.err{background:#ef4444}.sync-dot.loading{background:#f59e0b;animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.sync-label{font-size:12px;color:#666}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1.25rem}
.nb{padding:7px 15px;border-radius:8px;border:1px solid #ddd;background:#fff;color:#555;font-size:13px;cursor:pointer;font-family:inherit}
.nb:hover{background:#f0efeb}.nb.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:1.25rem}
.st{background:#fff;border-radius:10px;padding:.75rem 1rem;border:1px solid #e8e6e0}
.st-l{font-size:11px;color:#888;margin-bottom:4px}.st-v{font-size:22px;font-weight:700}
.c-ok{color:#16a34a}.c-warn{color:#d97706}.c-danger{color:#dc2626}
.emp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-bottom:1rem}
.emp-card{background:#fff;border:1px solid #e8e6e0;border-radius:12px;padding:1rem;cursor:pointer;transition:all .15s}
.emp-card:hover{border-color:#aaa;box-shadow:0 2px 8px rgba(0,0,0,.07)}
.emp-card.sw{border-color:#fcd34d}.emp-card.sd{border-color:#fca5a5}
.av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;margin-bottom:9px}
.av32{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;flex-shrink:0}
.en{font-size:15px;font-weight:700;margin-bottom:2px}.es{font-size:12px;color:#888;margin-bottom:8px}
.badges{display:flex;gap:4px;flex-wrap:wrap}
.badge{font-size:10px;padding:2px 7px;border-radius:20px;font-weight:700}
.bd{background:#fee2e2;color:#dc2626}.bw{background:#fef3c7;color:#d97706}
.bs{background:#dcfce7;color:#16a34a}.bi{background:#dbeafe;color:#2563eb}.bn{background:#f3f4f6;color:#555}
.add-card{background:transparent;border:1.5px dashed #ccc;border-radius:12px;padding:1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;color:#999;font-size:13px;min-height:130px;font-family:inherit}
.add-card:hover{background:#f9f8f5;border-color:#aaa}
.card{background:#fff;border:1px solid #e8e6e0;border-radius:12px;padding:1rem 1.2rem;margin-bottom:10px}
.card.bad{border-color:#fca5a5}
.back-btn{font-size:13px;color:#666;background:transparent;border:none;cursor:pointer;display:flex;align-items:center;gap:4px;margin-bottom:1rem;padding:0;font-family:inherit}
.tabs{display:flex;gap:6px;margin-bottom:1rem;flex-wrap:wrap}
.tab{padding:6px 14px;border-radius:8px;border:1px solid #ddd;background:#fff;color:#666;font-size:13px;cursor:pointer;font-family:inherit}
.tab.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.dh{display:flex;align-items:center;gap:12px;margin-bottom:1rem;padding-bottom:1rem;border-bottom:1px solid #f0efeb}
.dn{font-size:17px;font-weight:700}.ds{font-size:12px;color:#888;margin-top:2px}
.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:1rem}
.ii{background:#f9f8f5;border-radius:8px;padding:.65rem .9rem}
.ii.wb{background:#fff7ed;border:1px solid #fed7aa}
.il{font-size:11px;color:#888;margin-bottom:3px}.iv{font-size:13px;font-weight:700}
.cl-list{display:flex;flex-direction:column;gap:7px}
.cl-item{display:flex;align-items:flex-start;gap:10px;padding:.7rem 1rem;background:#fff;border:1px solid #e8e6e0;border-radius:9px}
.cl-item.ov{border-color:#fca5a5;background:#fff9f9}.cl-item.sn{border-color:#fcd34d;background:#fffdf0}
.chk{width:19px;height:19px;border-radius:4px;border:1.5px solid #ccc;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;background:#fff}
.chk.done{background:#16a34a;border-color:#16a34a}
.fg{margin-bottom:.85rem}.fl{font-size:12px;color:#555;margin-bottom:5px;display:block;font-weight:600}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
input[type=text],input[type=date],input[type=number],input[type=month],select,textarea{width:100%;font-size:13px;padding:8px 11px;border-radius:8px;border:1px solid #ddd;background:#fff;color:#1a1a1a;font-family:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:#1a1a1a}
textarea{resize:vertical;min-height:80px}
.btn{padding:8px 16px;border-radius:8px;border:1px solid #ddd;background:#fff;color:#1a1a1a;font-size:13px;cursor:pointer;font-family:inherit;font-weight:600}
.btn:hover{background:#f0efeb}.btn.pri{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.btn.pri:hover{background:#333}.btn.dan{color:#dc2626;border-color:#fca5a5}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:.8rem}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-start;justify-content:center;z-index:100;overflow-y:auto;padding:2rem 1rem}
.modal{background:#fff;border-radius:16px;padding:1.75rem;width:460px;max-width:100%;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.modal-title{font-size:16px;font-weight:700;margin-bottom:1.1rem}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:1.1rem}
.alert{background:#fff7ed;border:1px solid #fed7aa;border-radius:10px;padding:.75rem 1rem;margin-bottom:1rem;font-size:13px;color:#92400e}
.ot-bar{display:flex;align-items:center;gap:8px;margin-bottom:1rem;flex-wrap:wrap}
.ot-ebtn{padding:6px 14px;border-radius:8px;border:1px solid #ddd;background:#fff;color:#555;font-size:13px;cursor:pointer;font-family:inherit;font-weight:600}
.ot-ebtn.active{background:#1a1a1a;color:#fff;border-color:#1a1a1a}
.ph-table td,.ph-table th{padding:.55rem .8rem;border-bottom:1px solid #f0efeb}
.ph-table{width:100%;border-collapse:collapse;font-size:13px}
.day-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-bottom:1rem}
.dh2{font-size:11px;color:#888;text-align:center;padding:5px 0;font-weight:700}
.dc{border:1px solid #e8e6e0;border-radius:8px;padding:4px;min-height:88px;background:#fff}
.dc.empty{background:transparent;border-color:transparent}
.dc.hol{background:#fff5f5}.dc.hot{border-color:#fcd34d;background:#fffdf0}
.dn2{font-size:10px;color:#888;margin-bottom:3px;font-weight:700}
.dn2.sun{color:#dc2626}.dn2.sat{color:#2563eb}
.di{width:100%;font-size:11px;padding:2px 3px;border-radius:4px;border:1px solid #e0e0e0;background:#f9f8f5;color:#1a1a1a;text-align:center;font-family:inherit;margin-top:2px}
.di:focus{border-color:#1a1a1a;outline:none}.di.abs{border-color:#fca5a5;background:#fff9f9}
/* ── 연장근무 드롭다운 그리드 ── */
.ot-day-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:.6rem}
.ot-dh{text-align:center;font-size:11px;font-weight:600;color:#aaa;padding-bottom:4px}
.ot-dh.sat{color:#185FA5}.ot-dh.sun{color:#A32D2D}
.ot-dc{position:relative;border-radius:8px;border:0.5px solid #e0ddd6;background:#fff;padding:6px 6px 8px;min-height:44px;cursor:pointer;transition:border-color .15s}
.ot-dc:hover{border-color:#bbb}
.ot-dc.empty-day{background:transparent;border-color:transparent;cursor:default}
.ot-dc.active{border:1.5px solid #378ADD}
.ot-dc.has-data{background:#fafaf7}
.ot-dc.hol-day{background:#fff5f5}
.ot-dc.week-ov{border-color:#ef4444!important}
.ot-dn{font-size:11px;font-weight:600;color:#888;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
.ot-dn.sun{color:#A32D2D}.ot-dn.sat{color:#185FA5}
.ot-toggle{font-size:13px;line-height:1;color:#ccc}
.ot-chips{display:flex;flex-direction:column;gap:2px}
.ot-chip{font-size:10px;padding:2px 5px;border-radius:4px;font-weight:500;line-height:1.5;white-space:nowrap}
.chip-ext{background:#FAEEDA;color:#633806}
.chip-night{background:#EEEDFE;color:#3C3489}
.chip-hol{background:#FCEBEB;color:#791F1F}
.chip-early{background:#E6F1FB;color:#0C447C}
.chip-abs{background:#FBEAF0;color:#72243E}
.ot-drop{position:absolute;top:calc(100% + 4px);left:0;width:212px;background:#fff;border:1px solid #d1cfc8;border-radius:10px;padding:10px 12px;z-index:300;box-shadow:0 6px 20px rgba(0,0,0,0.12)}
.ot-drop.right{left:auto;right:0}
.ot-dtitle{font-size:11px;font-weight:700;color:#555;margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid #eee}
.ot-field{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.ot-badge{font-size:10.5px;padding:2px 7px;border-radius:4px;font-weight:500}
.ot-inp{width:66px;height:28px;border-radius:6px;border:1px solid #ddd;text-align:center;font-size:12px;font-family:inherit;background:#fff;color:#1a1a1a}
.ot-inp:focus{outline:none;border-color:#378ADD}
.ot-inp:disabled{background:#f5f5f5;color:#aaa;cursor:not-allowed}
.ot-dhint{font-size:10px;color:#bbb;margin-top:6px;padding-top:6px;border-top:1px solid #eee}
.ot-sum-bar{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.ot-sum{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:.75rem}
.osi{background:#fff;border:1px solid #e8e6e0;border-radius:10px;padding:.65rem .9rem;text-align:center}
.osl{font-size:11px;color:#888;margin-bottom:3px}.osv{font-size:17px;font-weight:700}
.hint{font-size:11px;color:#aaa;margin-bottom:8px}
.slip{background:#fff;border:1px solid #ddd;border-radius:14px;padding:1.75rem;max-width:500px;margin:0 auto}
.sl-title{font-size:18px;font-weight:700;text-align:center;margin-bottom:4px}
.sl-sub{font-size:12px;color:#888;text-align:center;margin-bottom:1.1rem}
.sl-div{border:none;border-top:1px solid #eee;margin:.8rem 0}
.sl-sec{font-size:11px;font-weight:700;color:#888;margin:8px 0 5px}
.sl-row{display:flex;justify-content:space-between;padding:.32rem 0;font-size:13px}
.sl-row.tot{font-weight:700;font-size:14px;border-top:1px solid #eee;padding-top:.55rem;margin-top:.3rem}
.sl-row.ded{color:#dc2626}.sl-row.net{font-size:16px;font-weight:700;color:#16a34a}
.sl-sign{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:1rem;padding-top:.8rem;border-top:1px solid #eee}
.sl-sign-box{font-size:12px;color:#666;line-height:2.1}
.gi{display:flex;align-items:center;gap:10px;padding:.7rem 1rem;background:#fff;border:1px solid #e8e6e0;border-radius:9px}
.gi.ov{border-color:#fca5a5;background:#fff9f9}.gi.sn{border-color:#fcd34d;background:#fffdf0}
.lv-item{display:flex;align-items:center;gap:10px;padding:.6rem .9rem;background:#f9f8f5;border-radius:8px;font-size:13px;margin-bottom:6px}
.lv-form{background:#f9f8f5;border-radius:8px;padding:.9rem;border:1px solid #e8e6e0;margin-top:.75rem}
.lw{display:flex;align-items:center;justify-content:center;padding:4rem;color:#888;gap:10px}
.sp{width:22px;height:22px;border:2.5px solid #e0e0e0;border-top-color:#555;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pw-screen{position:fixed;inset:0;background:#f5f3ef;z-index:99999;display:flex;align-items:center;justify-content:center;}
.pw-box{background:#fff;border-radius:16px;padding:2.5rem 2rem;width:320px;box-shadow:0 8px 32px rgba(0,0,0,.12);text-align:center;}
.pw-logo{font-size:2rem;margin-bottom:.5rem}
.pw-title{font-size:18px;font-weight:700;margin-bottom:.25rem}
.pw-sub{font-size:12px;color:#888;margin-bottom:1.5rem}
.pw-input{width:100%;padding:.7rem 1rem;border:1.5px solid #ddd;border-radius:8px;font-size:16px;text-align:center;letter-spacing:.3em;box-sizing:border-box;margin-bottom:.75rem;outline:none}
.pw-input:focus{border-color:#c8a882}
.pw-btn{width:100%;padding:.75rem;background:#1a1a1a;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer}
.pw-err{color:#dc2626;font-size:12px;margin-top:.5rem;min-height:18px}
.pw-change{font-size:11px;color:#aaa;margin-top:1rem;cursor:pointer;text-decoration:underline}
.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:#1a1a1a;color:#fff;border-radius:10px;padding:.7rem 1.2rem;font-size:13px;z-index:9999;opacity:0;transition:opacity .3s;pointer-events:none}
.toast.show{opacity:1}
.dc.week-ov{border:2px solid #ef4444!important;background:#fff5f5!important}
.week-warn-bar{grid-column:1/-1;background:#fee2e2;border:1px solid #fca5a5;border-radius:6px;padding:.35rem .7rem;font-size:11px;color:#dc2626;font-weight:700;text-align:center;margin:2px 0}
.qi-card{background:#fff;border:1px solid #e8e6e0;border-radius:10px;padding:.9rem 1.1rem;margin-bottom:8px}
.qi-card.qi-warn{border-color:#fcd34d;background:#fffdf0}
.qi-card.qi-over{border-color:#fca5a5;background:#fff9f9}
.qi-hist{max-height:120px;overflow-y:auto;margin-top:.5rem;border-top:1px solid #f0efeb;padding-top:.5rem}
.sign-pad-wrap{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:1rem}
.sign-pad-box{border:1px solid #ddd;border-radius:8px;overflow:hidden;background:#fff}
.sign-pad-label{background:#f0efeb;font-size:12px;font-weight:700;padding:6px 10px;display:flex;align-items:center;justify-content:space-between}
.sign-pad-canvas{display:block;cursor:crosshair;touch-action:none}
.sign-pad-meta{font-size:11px;color:#888;padding:5px 10px 7px}
.sched-tbl th{background:#f0efeb;font-weight:700;padding:5px 6px;border:1px solid #ddd;text-align:center}
.sched-tbl td{padding:4px 5px;border:1px solid #ddd;text-align:center}
.sched-tbl select,.sched-tbl input[type=checkbox]{font-size:12px}
.sched-tbl select{padding:3px 2px;border-radius:4px;border:1px solid #ddd;width:72px}
.extras-row{display:flex;align-items:center;gap:6px;margin-bottom:5px}
.extras-row input{flex:1;font-size:13px;padding:5px 8px;border:1px solid #ddd;border-radius:6px}
@media(max-width:600px){.stats{grid-template-columns:repeat(2,1fr)}.fr,.fr3{grid-template-columns:1fr}.ot-sum{grid-template-columns:repeat(2,1fr)}.info-grid{grid-template-columns:1fr}.day-grid{gap:3px}.di{font-size:10px;padding:1px 2px}.dc{padding:3px;min-height:80px}}
#pz{display:none}
@media print{
  @page{margin:1cm 1.2cm;size:A4 landscape}
  body>*{display:none!important}
  #pz{display:block!important;position:static!important;width:100%!important;height:auto!important;overflow:visible!important;background:#fff;padding:0;margin:0;z-index:auto}
}

</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div class="app-title">🍡 남씨네전통식품 인사관리</div>
    <div class="top-right">
      <div class="sync-bar"><div class="sync-dot" id="sdot"></div><span class="sync-label" id="slbl">연결 중...</span></div>
      <button class="btn" data-action="loadAll" style="font-size:12px;padding:5px 12px">↺ 새로고침</button>
      <button class="btn" onclick="diagConnection()" style="font-size:12px;padding:5px 12px">🔌 연결 진단</button>
      <button class="btn" data-action="openIns" style="font-size:12px;padding:5px 12px">⚙ 보험료율</button>
    </div>
  </div>
  <div class="nav">
    <button class="nb active" id="n0" data-action="gv" data-id="0">직원 관리</button>
    <button class="nb" id="n1" data-action="gv" data-id="1">연장근무</button>
    <button class="nb" id="n2" data-action="gv" data-id="2">급여명세서</button>
    <button class="nb" id="n3" data-action="gv" data-id="3">근로계약서</button>
    <button class="nb" id="n4" data-action="gv" data-id="4">사업장 의무</button>
  </div>
  <div id="sta"></div>
  <div id="main"></div>
  <div id="mod"></div>
</div>
<!-- 비밀번호 잠금 화면 -->
<div id="pw-screen" class="pw-screen" style="display:none">
  <div class="pw-box">
    <div class="pw-logo">🍡</div>
    <div class="pw-title">남씨네전통식품</div>
    <div class="pw-sub">인사관리 시스템 · 담당자 전용</div>
    <input type="password" id="pw-input" class="pw-input" placeholder="••••" maxlength="20"
      onkeydown="if(event.key==='Enter')checkPw()">
    <button class="pw-btn" onclick="checkPw()">확인</button>
    <div class="pw-err" id="pw-err"></div>
    <div class="pw-change" onclick="changePwMode()">비밀번호 변경</div>
  </div>
</div>
<div id="pw-change-screen" class="pw-screen" style="display:none">
  <div class="pw-box">
    <div class="pw-logo">🔑</div>
    <div class="pw-title">비밀번호 변경</div>
    <div class="pw-sub">현재 비밀번호 확인 후 변경합니다</div>
    <input type="password" id="pw-old" class="pw-input" placeholder="현재 비밀번호" maxlength="20" style="margin-bottom:.5rem">
    <input type="password" id="pw-new1" class="pw-input" placeholder="새 비밀번호" maxlength="20" style="margin-bottom:.5rem">
    <input type="password" id="pw-new2" class="pw-input" placeholder="새 비밀번호 확인" maxlength="20"
      onkeydown="if(event.key==='Enter')doChangePw()">
    <button class="pw-btn" onclick="doChangePw()">변경하기</button>
    <div class="pw-err" id="pw-change-err"></div>
    <div class="pw-change" onclick="cancelChangePw()">취소</div>
  </div>
</div>
<div id="pz"></div>
<div class="toast" id="toast"></div>
<script>

var SHEET = "https://script.google.com/macros/s/AKfycbzfXSDDCAELSJs7Ew-Qgf7x56NbNx_7nXVRhxuk9mn7Xhmu31WkIlnu-DujhnPON8DB/exec";

// ── 비밀번호 인증 ──
var DEFAULT_PW = "1234"; // 최초 기본 비밀번호
var PW_SESSION_KEY = "tteok_auth";
var PW_STORE_KEY = "tteok_pw";

function getStoredPw(){ return localStorage.getItem(PW_STORE_KEY)||DEFAULT_PW; }
function isAuthed(){ return sessionStorage.getItem(PW_SESSION_KEY)==="1"; }
function setAuthed(){ sessionStorage.setItem(PW_SESSION_KEY,"1"); }

function initAuth(){
  if(isAuthed()){ showApp(); return; }
  function showLogin(){
    document.getElementById("pw-screen").style.display="flex";
    setTimeout(function(){ var el=document.getElementById("pw-input"); if(el) el.focus(); },100);
  }
  // 로그인 화면 뜨기 전에 GAS에서 최신 비밀번호 먼저 동기화
  apiGet({type:"pw"})
    .then(function(d){
      if(d.pw && typeof d.pw==="string" && d.pw.length>=4){
        localStorage.setItem(PW_STORE_KEY, d.pw);
      }
      showLogin();
    })

function calcLeave(j){
  // 5인이상 전환일(2026-05-01) 이전 입사자는 전환일부터 연차 발생
  var joinDt = new Date(j);
  var effectiveDt = joinDt > OVER5_DATE ? joinDt : OVER5_DATE;
  var mo = Math.floor((TODAY - effectiveDt) / (864e5 * 30.44));
  if(mo < 0) return 0;
  var yr = Math.floor(mo / 12);
  return yr < 1 ? Math.min(mo, 11) : Math.min(15 + Math.floor((yr-1)/2), 25);
}
// 결근 반영 연차 발생 계산
// · 1년 미만: 결근한 달은 연차 미발생 (개근한 달만 1일, 최대 11일)
// · 1년 이상: 완성된 연도별 출근율 80% 미만이면 그 해 연차 미발생
function calcLeaveEarned(e){
  var joinDt=new Date(e.joinDate);
  var effectiveDt=joinDt>OVER5_DATE?joinDt:OVER5_DATE;
  var absData=S.absence[e.id]||{};
  var wkDays=(e.workDays&&e.workDays.length)||5;
  var mo=Math.floor((TODAY-effectiveDt)/(864e5*30.44));
  if(mo<0) return 0;
  var yr=Math.floor(mo/12);
  function absForMo(mk){ var days=absData[mk]||{},n=0; Object.keys(days).forEach(function(d){ n+=Number(days[d])||0; }); return n; }
  function moKey(offset){ var d=new Date(effectiveDt); d.setMonth(d.getMonth()+offset); var mn=d.getMonth()+1; return d.getFullYear()+'-'+(mn<10?'0':'')+mn; }
  if(yr<1){
    var earned=0;
    for(var m=0;m<mo&&earned<11;m++){ if(absForMo(moKey(m))===0) earned++; }
    return earned;
  } else {
    var total=0;
    for(var y=0;y<yr;y++){
      var absInYear=0;
      for(var mi=y*12;mi<(y+1)*12;mi++) absInYear+=absForMo(moKey(mi));
      var scheduled=Math.round(wkDays*52);
      var rate=scheduled>0?(scheduled-absInYear)/scheduled:1;
      if(rate>=0.8) total+=Math.min(15+Math.floor(y/2),25);
    }
    return total;
  }
}
// 통상임금 일급 (미사용 연차수당 계산용)
function calcDailyWage(e){
  var mh=e.monthlyPayHours||209;
  var dailyH=(e.weeklyHours||40)/((e.workDays&&e.workDays.length)||5);
  var base=e.totalPay||e.base||0;
  if(!base) return 0;
  return Math.round(base/mh*dailyH);
}
// 이 달(mo)이 수습기간 내인지 판별
function isProbMonth(e, mo){
  if(!e.probEnd) return false;
  // 수습종료일이 입사일과 같으면 수습 없음 처리
  if(e.joinDate && e.probEnd === e.joinDate) return false;
  // 해당 월 1일이 수습종료일보다 strictly 이전인 경우만 수습
  return new Date(mo+'-01') < new Date(e.probEnd);
}

// ── 불러오기: fetch + CORS 방식 ──
// GAS를 "모든 사용자" 공개 배포 시 CORS(Access-Control-Allow-Origin: *)를 지원함.
// 기존 JSONP(<script>태그) 방식은 GitHub Pages의 CSP 정책으로 차단되어 fetch로 전환.
function apiGet(p){
  var params=new URLSearchParams(p);
  return fetch(SHEET+"?"+params.toString(),{method:"GET"})
    .then(function(r){
      if(!r.ok) throw new Error("HTTP "+r.status);
      return r.json();
    });
}
// ── 저장: no-cors fetch ──
// GAS POST는 CORS preflight 없이 text/plain 단순요청으로 전송.
// 응답을 못 읽어도 시트 저장은 정상 처리됨.
function apiPost(d){
  return fetch(SHEET,{
    method:"POST",
    mode:"no-cors",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body:JSON.stringify(d)
  });
}

          workDays:( se.workDays && se.workDays.length ) ? se.workDays : (local.workDays||[]),
          weeklyHours:se.weeklyHours||local.weeklyHours||0,
          monthlyPayHours:se.monthlyPayHours||local.monthlyPayHours||0,
          memo:se.memo||local.memo||"",
          workType:se.workType||local.workType||"정규직",
          nationality:se.nationality||local.nationality||"내국인",
          hourlyRate:se.hourlyRate||local.hourlyRate||0,
          ins4:se.ins4||local.ins4||{pension:true,health:true,empIns:true,care:true},
          dependents:se.dependents!=null?se.dependents:(local.dependents||1),
          flexPartTime:se.flexPartTime!=null?se.flexPartTime:(local.flexPartTime||false),
          excelExclude:se.excelExclude!=null?se.excelExclude:(local.excelExclude||false)
        };
      });
      S.emps=merged;
      // OT: 서버 데이터 기준으로 하되, 서버에 없는 월은 로컬 유지 (병합)
      var serverOT=d.otAll||{};
      // 구글 시트에서 "01" → 1(숫자)로 변환되는 문제 → 0패딩 정규화
      function normDayKeys(otObj){
        var result={};
        Object.keys(otObj).forEach(function(eid2){
          result[eid2]={};
          Object.keys(otObj[eid2]).forEach(function(mo2){
            result[eid2][mo2]={};
            Object.keys(otObj[eid2][mo2]).forEach(function(day){
              var dk=String(day).length===1?"0"+String(day):String(day);
              result[eid2][mo2][dk]=otObj[eid2][mo2][day];
            });
          });
        });
        return result;
      }
      serverOT=normDayKeys(serverOT);
      if(Object.keys(serverOT).length>0){
        // 시트(서버)를 기준으로 삼되,
        //  - 서버에 없는 날짜는 로컬값으로 채우고
        //  - 이번 세션에서 내가 방금 수정한 칸(S.dirty)은 로컬값을 보호한다.
        // → 다른 컴퓨터에서 올린 값이 정상 반영되고, 방금 타이핑한 값도 안 날아감.
        var mergedOT=serverOT;
        var dirty=S.dirty||{};
        Object.keys(S.ot).forEach(function(eid2){
          if(!mergedOT[eid2]) mergedOT[eid2]={};
          Object.keys(S.ot[eid2]||{}).forEach(function(mo2){
            if(!mergedOT[eid2][mo2]) mergedOT[eid2][mo2]={};
            Object.keys(S.ot[eid2][mo2]||{}).forEach(function(_d){
              var hasServer = mergedOT[eid2][mo2][_d]!==undefined;
              var isDirty = dirty[eid2+"|"+mo2+"|"+_d];
              if(!hasServer || isDirty){ mergedOT[eid2][mo2][_d]=S.ot[eid2][mo2][_d]; }
            });
          });
        });
        S.ot=mergedOT;
      }
      // 서버가 빈값 반환 시 로컬 OT 보존 (덮어쓰지 않음)
      S.ct=d.contracts||{};
      // done/gdone: 서버값 없으면 로컬 유지
      if(d.empDone && Object.keys(d.empDone).length) S.done=d.empDone;
      if(d.globalDone && d.globalDone.length) S.gdone=d.globalDone;
      // absence: 서버 기준 병합 + 0패딩 정규화
      if(d.absence && Object.keys(d.absence).length>0){
        // 날짜 키 정규화
        var normAbs={};
        Object.keys(d.absence).forEach(function(eid3){
          normAbs[eid3]={};
          Object.keys(d.absence[eid3]).forEach(function(mo3){
            normAbs[eid3][mo3]={};
            Object.keys(d.absence[eid3][mo3]).forEach(function(day3){
              var dk3=String(day3).length===1?"0"+String(day3):String(day3);
              normAbs[eid3][mo3][dk3]=d.absence[eid3][mo3][day3];
            });
          });
        });
        var mergedAbs=normAbs;
        var dirtyA=S.dirty||{};
        Object.keys(S.absence).forEach(function(eid3){
          if(!mergedAbs[eid3]) mergedAbs[eid3]={};
          Object.keys(S.absence[eid3]||{}).forEach(function(mo3){
            if(!mergedAbs[eid3][mo3]) mergedAbs[eid3][mo3]={};
            // 시트 기준, 단 서버에 없는 날짜 또는 이번 세션에서 수정한 칸은 로컬 보호
            Object.keys(S.absence[eid3][mo3]||{}).forEach(function(_d3){
              var hasS = mergedAbs[eid3][mo3][_d3]!==undefined;
              var dty = dirtyA[eid3+"|"+mo3+"|"+_d3];
              if(!hasS || dty){ mergedAbs[eid3][mo3][_d3]=S.absence[eid3][mo3][_d3]; }
            });
          });
        });
        S.absence=mergedAbs;
      }
      if(d.leave) S.leave=d.leave;
      if(d.slipMemo) S.slipMemo=d.slipMemo;
      if(d.extras) S.extras=d.extras;
      if(d.payHistory) S.payHistory=d.payHistory;
      if(!S.otEmp&&S.emps.length) S.otEmp=S.emps[0].id;
      // 서버 비밀번호 동기화: GAS에 저장된 값이 있으면 로컬에 반영
      if(d.pw && typeof d.pw==="string" && d.pw.length>=4){
        localStorage.setItem(PW_STORE_KEY, d.pw);
      }
      // ptLogs: 서버값 기준 병합 + 로컬 전용 키도 체크
      var _localPt={};
      try{var _ptRaw=localStorage.getItem('tteok_ptlogs');if(_ptRaw)_localPt=JSON.parse(_ptRaw)||{};}catch(e){}
      var _serverPt=d.ptLogs||{};
      // 서버 + 로컬 모두 합쳐서 최종 ptLogs 구성
      var _mergedPt=JSON.parse(JSON.stringify(_serverPt)); // 서버값 복사
      // 로컬에만 있는 항목 추가 (서버에 없는 것만)
      var _toUpload=[];
      Object.keys(_localPt).forEach(function(eid6){
        if(!_mergedPt[eid6]) _mergedPt[eid6]={};
        Object.keys(_localPt[eid6]||{}).forEach(function(mo6){
          var localLogs=_localPt[eid6][mo6]||[];
          if(!_mergedPt[eid6][mo6] || !_mergedPt[eid6][mo6].length){
            // 서버에 없는 로컬 데이터 → 병합 후 서버 업로드 예약
            if(localLogs.length>0){
              _mergedPt[eid6][mo6]=localLogs;
              _toUpload.push({eid:eid6,mo:mo6,logs:localLogs});
            }
          }
        });
      });
      S.ptLogs=_mergedPt;
      // 로컬에만 있던 데이터 서버로 업로드 (마이그레이션)
      if(_toUpload.length){
        setTimeout(function(){
          for(var _ui=0;_ui<_toUpload.length;_ui++){
            (function(_u){ apiSavePtLogs(_u.eid,_u.mo,_u.logs); })(_toUpload[_ui]);
          }
          toast("↑ 알바 근무기록 서버 업로드 완료 ("+_toUpload.length+"건)");
        },1500);
      }
      setSyncSt("ok"); toast("✓ 데이터 불러옴"); saveCache();
      try{localStorage.setItem('tteok_ptlogs',JSON.stringify(S.ptLogs));}catch(e){}
      autoSavePayHistory();
      checkNotifications();
    } else { setSyncSt("err"); toast("불러오기 실패"); }
    S.loading=false; render();
  }).catch(function(){ setSyncSt("err"); toast("연결 오류"); S.loading=false; render(); });
  fetchHolidays(TODAY.getFullYear());
  fetchHolidays(TODAY.getFullYear()+1);
}
function setSyncSt(st, detail){
  var dot=document.getElementById("sdot"), lbl=document.getElementById("slbl"); if(!dot) return;
  dot.className="sync-dot"+(st==="err"?" err":st==="loading"?" loading":"");
  if(st==="ok") lbl.textContent="구글 시트 연동됨";
  else if(st==="loading") lbl.textContent="동기화 중...";
  else lbl.textContent="연결 오류"+(detail?" ("+detail+")":"");
}

function fetchHolidays(yr){
  if(!S.holidays[yr]) S.holidays[yr]={};
  // 고정 공휴일 적용 (항상 덮어쓰기)
  var fk=Object.keys(FIXED_HOLIDAYS);
  for(var i=0;i<fk.length;i++) S.holidays[yr][yr+"-"+fk[i]]=1;
  // 음력 공휴일 적용 (항상 덮어쓰기)
  var lh=LUNAR_HOLIDAYS[yr]||[];
  for(var j=0;j<lh.length;j++) S.holidays[yr][lh[j]]=1;
  saveCache();
  // 공공데이터 API 호출 (인증키가 있을 때만)
  if(HOLIDAY_KEY==="YOUR_API_KEY"){ render(); return; }
  var months=["01","02","03","04","05","06","07","08","09","10","11","12"];
  var fetched=0;
  for(var m=0;m<months.length;m++){
    (function(mo){
      fetch(HOLIDAY_API+"?serviceKey="+HOLIDAY_KEY+"&solYear="+yr+"&solMonth="+mo+"&_type=json&numOfRows=20")
        .then(function(r){return r.json();})
        .then(function(d){
          var items=(((d.response||{}).body||{}).items||{}).item||[];
          if(!Array.isArray(items)) items=[items];
          for(var k=0;k<items.length;k++){
            var dt=String(items[k].locdate||"");
            if(dt.length===8){
              var key=dt.slice(0,4)+"-"+dt.slice(4,6)+"-"+dt.slice(6,8);
              S.holidays[yr][key]=1;
            }
          }
          fetched++;
          if(fetched===12){ saveCache(); render(); }
        }).catch(function(){ fetched++; if(fetched===12){ saveCache(); render(); } });
    })(months[m]);
  }
}
function isHoliday(dateStr){
  // dateStr: "2026-03-01"
  var yr=parseInt(dateStr.slice(0,4));
  if(S.holidays[yr] && S.holidays[yr][dateStr]) return true;
  // fallback 고정 공휴일 체크
  var mmdd=dateStr.slice(5); // "03-01"
  return !!FIXED_HOLIDAYS[mmdd];
}

// ── 급여 이력 자동 저장 ──
function autoSavePayHistory(){
  if(!S.emps.length) return;
  // 이전달 급여를 자동 저장 (이미 저장된 달은 스킵)
  var d=new Date(TODAY); d.setDate(1); d.setMonth(d.getMonth()-1);
  var prevMo=d.getFullYear()+"-"+p2(d.getMonth()+1);
  for(var i=0;i<S.emps.length;i++){
    var e=S.emps[i];
    if(!S.payHistory[e.id]) S.payHistory[e.id]=[];
    // 이미 저장된 달이면 스킵
    var exists=false;
    for(var j=0;j<S.payHistory[e.id].length;j++){
      if(S.payHistory[e.id][j].month===prevMo){exists=true;break;}
    }
    if(exists) continue;
    var p=calcPay(e,prevMo);
    S.payHistory[e.id].push({month:prevMo,base:e.base,meal:e.meal||0,ext:p.ext,night:p.night,hol:p.hol,absDeduct:p.absDeduct,gross:p.gross,totalDed:p.totalDed,net:p.net,absDays:p.absDays,totExt:p.tot.ext,totNight:p.tot.night,totHol:p.tot.holiday,incomeTax:p.incomeTax||0,localTax:p.localTax||0,savedAt:new Date().toISOString()});
  }
  saveCache();
  apiPost({type:"savePayHistory",payHistory:S.payHistory}).catch(function(){});
}
function getPayHistory(eid){
  return (S.payHistory[eid]||[]).slice().sort(function(a,b){return b.month.localeCompare(a.month);});
}

// ── data-* 이벤트 핸들러 (onclick에서 JS 변수 전달용) ──
function getEmp(id){ for(var i=0;i<S.emps.length;i++) if(S.emps[i].id===id) return S.emps[i]; return null; }
// 클릭 이벤트 위임 - 모든 data-action 처리
document.addEventListener("click", function(ev){
  // 오버레이 배경 클릭 시 모달 닫기 (modal-box 밖을 클릭한 경우)
  if(S.mod && ev.target && ev.target.id === "overlay-bg"){
    S.mod=null; render(); return;
  }
  var el = ev.target;
  while(el && el !== document.body){
    var action = el.getAttribute("data-action");
    if(action){
      var id = el.getAttribute("data-id")||"";
      var val = el.getAttribute("data-val")||"";
      handleAction(action, id, val, el, ev);
      return;
    }
    el = el.parentElement;
  }
});
// change 이벤트 위임 - month input 등 처리
document.addEventListener("change", function(ev){
  var el = ev.target;
  var action = el.getAttribute("data-action");
  if(action){
    var id = el.getAttribute("data-id")||"";
    var val = el.getAttribute("data-val")||"";
    handleAction(action, id, val, el, ev);
  }
});
function handleAction(action, id, val, el, ev){
  if(action==="selEmp"){ S.sel=id; S.dtab="checklist"; render(); }
  else if(action==="back"){ S.sel=null; render(); }
  else if(action==="setDtab"){ S.dtab=id; render(); }
  else if(action==="gv"){ S.view=parseInt(id); S.sel=null; render(); }
  else if(action==="openMod"){ S.mod={t:id,id:val}; render(); }
  else if(action==="closeMod"){ S.mod=null; render(); }
  else if(action==="toggleDone"){
    if(!S.done[id]) S.done[id]=[];
    var a=S.done[id], idx=a.indexOf(val);
    if(idx>=0) a.splice(idx,1); else a.push(val);
    render(); apiSaveDone(id,S.done[id]);
  }
  else if(action==="toggleGDone"){
    var idx=S.gdone.indexOf(id);
    if(idx>=0) S.gdone.splice(idx,1); else S.gdone.push(id);
    render(); apiSaveGDone(S.gdone);
  }
  else if(action==="confirmDel"){
    var e=getEmp(id); if(!e) return;
    if(!confirm(e.name+" 직원을 삭제할까요?")) return;
    S.emps=S.emps.filter(function(x){return x.id!==id;});
    delete S.done[id]; delete S.ot[id]; delete S.ct[id]; delete S.leave[id]; delete S.absence[id];
    if(S.otEmp===id) S.otEmp=S.emps.length?S.emps[0].id:null;
    S.sel=null; saveCache(); render(); apiDelEmp(id); toast("직원 삭제됨");
  }
  else if(action==="setOtEmp"){ S.otEmp=id; render(); }
  else if(action==="delLeave"){
    var idx=parseInt(val);
    if(!S.leave[id]||!S.leave[id].used) return;
    if(!confirm("삭제할까요?")) return;
    S.leave[id].used.splice(idx,1);
    saveCache(); apiSaveLeave(id,S.leave[id]);
    toast("✓ 연차 삭제됨");
    renderLeaveSection(id);
  }
  else if(action==="addLeave"){ addLeave(id); }
  else if(action==="submitEmpForm"){
    var isEdit=val==="1";
    if(isEdit) saveEdit(id); else saveAdd();
  }
  else if(action==="saveSigns"){
    var eid4=id;
    var cBiz=document.getElementById("sign-biz"), cEmp=document.getElementById("sign-emp");
    if(!S.ct[eid4]) S.ct[eid4]={empId:eid4,signed:false,date:""};
    if(cBiz&&!isCanvasBlank(cBiz)) S.ct[eid4].signBiz=cBiz.toDataURL("image/png");
    if(cEmp&&!isCanvasBlank(cEmp)) S.ct[eid4].signEmp=cEmp.toDataURL("image/png");
    saveCache(); apiSaveCT(eid4,S.ct[eid4]); toast("✓ 서명이 저장됐습니다");
  }
  else if(action==="toggleSigned"){
    if(!S.ct[id]) S.ct[id]={empId:id,signed:false,date:""};
    S.ct[id].signed=!S.ct[id].signed;
    S.ct[id].date=S.ct[id].signed?new Date().toISOString().split("T")[0]:"";
    saveCache(); render();
    apiSaveCT(id,S.ct[id]);
    toast(S.ct[id].signed?"✓ 계약 완료 표시됨":"완료 표시 해제됨");
  }
  else if(action==="saveIns"){ saveIns(); }
  else if(action==="resetIns"){
    S.ins={pension:4.75,health:3.595,empIns:0.9,care:13.14};
    S.mod=null; render(); toast("기본값으로 초기화됨");
  }
  else if(action==="printSlip"){ printSlip(id); }
  else if(action==="dlContract"){ dlContract(id); }
  else if(action==="schedDay"){
    var d2=el.getAttribute("data-day"); if(d2) toggleSchedDay(d2);
  }
  else if(action==="applyDays"){
    var parts=id.split("_"); applyAllDays(parts[0],parts[1],parseFloat(parts[2])||1);
  }
  else if(action==="addExtra"){
    // data-id = eid + "~" + ym (구분자 ~로 변경)
    var sep=id.indexOf("~"), eid2=id.slice(0,sep), ym=id.slice(sep+1);
    var lb=document.getElementById("exlb_new"), am=document.getElementById("exam_new");
    if(!lb||!am||!lb.value.trim()||!am.value){toast("항목명과 금액을 입력하세요");return;}
    if(!S.extras[eid2]) S.extras[eid2]={};
    if(!S.extras[eid2][ym]) S.extras[eid2][ym]=[];
    S.extras[eid2][ym].push({label:lb.value.trim(),amount:parseInt(am.value)||0});
    saveCache(); apiSaveExtras(eid2,ym); S.mod={t:"slip",id:eid2}; render(); toast("✓ 항목 추가됨");
  }
  else if(action==="updateExtra"){
    var xi=parseInt(id), sep2b=el.getAttribute("data-val").indexOf("~");
    var eid3b=el.getAttribute("data-val").slice(0,sep2b), ym2b=el.getAttribute("data-val").slice(sep2b+1);
    var lbEl=document.getElementById("exlb_"+xi), amEl=document.getElementById("exam_"+xi);
    if(!lbEl||!amEl){toast("입력값을 찾을 수 없습니다");return;}
    if(!lbEl.value.trim()){toast("항목명을 입력하세요");return;}
    if(!S.extras[eid3b]) S.extras[eid3b]={};
    if(!S.extras[eid3b][ym2b]) S.extras[eid3b][ym2b]=[];
    S.extras[eid3b][ym2b][xi]={label:lbEl.value.trim(),amount:parseInt(amEl.value)||0};

function logToHours(log){
  function toH(v){ if(!v&&v!==0)return 0; var s=String(v); if(s.indexOf(':')>=0){var p=s.split(':');return parseInt(p[0])+(parseInt(p[1])||0)/60;} return parseFloat(v)||0; }
  var h=toH(log.e)-toH(log.s)-(parseFloat(log.b)||0);
  return h>0?Math.round(h*100)/100:0;
}
function fmtHHMM(v){ // "9" or "9.5" → "09:30"
  if(!v&&v!==0)return '--:--';
  var s=String(v); if(s.indexOf(':')>=0)return s;
  var n=parseFloat(v)||0; var hh=Math.floor(n); var mm=Math.round((n-hh)*60);
  return p2(hh)+':'+p2(mm);
}
function getPtWeeks(eid,mo){
  var logs=getPtLogs(eid,mo);
  var weekMap={};
  for(var i=0;i<logs.length;i++){
    var log=logs[i]; var d=new Date(log.date);
    var dow=d.getDay(); var monOff=(dow===0)?-6:1-dow;
    var mon=new Date(d); mon.setDate(mon.getDate()+monOff);
    var wk=mon.getFullYear()+'-'+p2(mon.getMonth()+1)+'-'+p2(mon.getDate());
    if(!weekMap[wk])weekMap[wk]={monday:mon,logs:[]};
    weekMap[wk].logs.push(log);
  }
  var wkeys=Object.keys(weekMap).sort(), weeks=[];
  for(var wi=0;wi<wkeys.length;wi++){
    var wk2=weekMap[wkeys[wi]];
    var sun=new Date(wk2.monday); sun.setDate(sun.getDate()+6);
    var sortedLogs=wk2.logs.slice().sort(function(a,b){return a.date.localeCompare(b.date);});
    var totalH=0;
    for(var li=0;li<sortedLogs.length;li++)totalH+=logToHours(sortedLogs[li]);
    totalH=Math.round(totalH*100)/100;
    var hasJuhyu=totalH>=15;
    var juhyuH=hasJuhyu?Math.min(Math.round(totalH/5*100)/100,8):0;
    weeks.push({key:wkeys[wi],monday:wk2.monday,sunday:sun,logs:sortedLogs,totalH:totalH,hasJuhyu:hasJuhyu,juhyuH:juhyuH});
  }
  return weeks;
}

// ── 야간 포괄시간 자동 계산 (출퇴근 기준, 야간=22:00~06:00) ──
function calcNightHoursPerDay(e){
  var s=parseInt(e.startTime||"9"), en=parseInt(e.endTime||"18");
  var br=parseFloat(e.breakHour)||1;
  // 근무 구간을 분 단위로 펼쳐서 야간 구간(22:00~06:00) 교차 계산
  var nightMins=0;
  var totalMins=((en-s+24)%24||24)*60 - br*60;
  var cur=s*60;
  var worked=0;
  while(worked<totalMins){
    var h=Math.floor(cur/60)%24;
    // 야간: 0~6시(0~360분), 22~24시(1320~1440분)
    if(h<6||h>=22) nightMins++;
    cur++; worked++;
  }
  return Math.round(nightMins/60*10)/10; // 시간 단위 소수 1자리
}
function calcMonthlyNightHours(e){
  if(e.schedule && Object.keys(e.schedule).length>0){
    var DAYIDX={"월":1,"화":2,"수":3,"목":4,"금":5,"토":6,"일":0};
    var weeks=4.345, total=0, sched=e.schedule, days=Object.keys(sched);
    for(var i=0;i<days.length;i++){
      var ds=sched[days[i]];
      var tmp={startTime:ds.s,endTime:ds.e,breakHour:ds.b};
      total+=calcNightHoursPerDay(tmp)*weeks;
    }
    return Math.round(total*10)/10;
  }
  return Math.round(calcNightHoursPerDay(e)*22*10)/10;
}
function calcMonthlyPayHours(e){
  if(e.schedule && Object.keys(e.schedule).length>0){
    var sched=e.schedule, days=Object.keys(sched), weekH=0;
    for(var i=0;i<days.length;i++){
      var ds=sched[days[i]];
      var wh=(parseInt(ds.e)-parseInt(ds.s))-(parseFloat(ds.b)||1);
      if(wh<0)wh+=24; weekH+=wh;
    }
    var juhyu=weekH>=15?weekH/days.length:0;
    return Math.round((weekH+juhyu)*4.345);
  }
  var wh=e.workHours||8; return Math.round((wh*5+wh)*4.345);
}
// ── 입사일/계약종료일 기준, 해당 월(ym) 내 실제 재직일 범위(일자, 1~dim) ──
// 입사 전/퇴사 후 달이면 endDay<startDay 가 되어 재직일수=0
function empServiceDayRange(e,yr,mth,dim){
  var startDay=1, endDay=dim;
  if(e.joinDate){
    var jd=new Date(e.joinDate);
    if(!isNaN(jd)){
      var jy=jd.getFullYear(), jm=jd.getMonth()+1;
      if(jy===yr && jm===mth) startDay=jd.getDate();
      else if(jy>yr || (jy===yr && jm>mth)) startDay=dim+1; // 이 달엔 아직 입사 전
    }
  }
  if(e.contractEnd){
    var ced=new Date(e.contractEnd);
    if(!isNaN(ced)){
      var cy=ced.getFullYear(), cm=ced.getMonth()+1;
      if(cy===yr && cm===mth) endDay=ced.getDate();
      else if(cy<yr || (cy===yr && cm<mth)) endDay=0; // 이 달 이전에 이미 계약종료
    }
  }
  return {startDay:startDay,endDay:endDay};
}
// 해당월 전체 기준 소정근무일수 (입사/퇴사와 무관, 식대 비율의 분모로 사용)
function calcMonthWorkDaysFull(e,ym){
  var yr=parseInt(ym.split("-")[0]),mo=parseInt(ym.split("-")[1]);
  var dim=new Date(yr,mo,0).getDate();
  var DN=["일","월","화","수","목","금","토"];
  var sched=e.schedule&&Object.keys(e.schedule).length>0?e.schedule:null;
  var cnt=0;
  for(var d=1;d<=dim;d++){
    var dateStr=ym+"-"+p2(d);
    var dow=new Date(yr,mo-1,d).getDay();
    var isWorkDay=sched?!!sched[DN[dow]]:(dow>=1&&dow<=5); // 스케줄 없으면 월~금 기본
    if(isWorkDay && !isHoliday(dateStr)) cnt++;
  }
  return cnt||22;
}
// 입사일/계약종료일로 재직기간 내로 제한한 소정근무일수 (식대 비율의 분자용)
function calcMonthWorkDays(e,ym){
  var yr=parseInt(ym.split("-")[0]),mo=parseInt(ym.split("-")[1]);
  var dim=new Date(yr,mo,0).getDate();
  var DN=["일","월","화","수","목","금","토"];
  var sched=e.schedule&&Object.keys(e.schedule).length>0?e.schedule:null;
  var rng=empServiceDayRange(e,yr,mo,dim);
  var full=(rng.startDay===1 && rng.endDay===dim);
  var cnt=0;
  for(var d=rng.startDay;d<=rng.endDay;d++){
    var dateStr=ym+"-"+p2(d);
    var dow=new Date(yr,mo-1,d).getDay();
    var isWorkDay=sched?!!sched[DN[dow]]:(dow>=1&&dow<=5); // 스케줄 없으면 월~금 기본
    if(isWorkDay && !isHoliday(dateStr)) cnt++;
  }
  return cnt||(full?22:0);
}
function getEmpExtras(eid,ym){return (S.extras[eid]&&S.extras[eid][ym])?S.extras[eid][ym]:[];}

// ── 포괄임금 역산 ──
function calcBase(e){
  var mPayH=calcMonthlyPayHours(e)||209;
  var totalPay = e.totalPay || e.base;
  var nightH = calcMonthlyNightHours(e);
  var hourRate = totalPay / (mPayH + nightH * 0.5);
  var base = Math.round(hourRate * mPayH);
  var nightPay = Math.round(hourRate * nightH * 0.5);
  return {base:base, nightPay:nightPay, nightH:nightH, hourRate:Math.round(hourRate), mPayH:mPayH};
}

// ── 주별 주휴수당 계산 ──
// 규칙:
//  - 결근이 있는 주 → 그 주 주휴수당 박탈
//  - 연차(leave) → 출근 간주 → 유지
//  - 연속결근이 주 경계를 넘어도 "하나의 결근 사건"으로 묶어 1주만 박탈
//    (예: 금요일 결근 + 다음주 월요일 결근 → 연속 → 1주만 박탈)
function calcJuhyuForMonth(e, mo){
  var yr=parseInt(mo.split("-")[0]), mth=parseInt(mo.split("-")[1]);
  var dim=new Date(yr,mth,0).getDate();
  var first=new Date(yr,mth-1,1).getDay();
  var DN=["일","월","화","수","목","금","토"];
  var rawSched=e.schedule||{};
  var schedDays=Object.keys(rawSched);

  // 스케줄 미등록 → 월~금 기본값으로 폴백
  var sched=schedDays.length?rawSched:{"월":1,"화":1,"수":1,"목":1,"금":1};
  var wkDays=schedDays.length||5;
  var wkH=e.weeklyHours||((e.workHours||8)*wkDays);
  if(wkH<15) return {juhyuWeeks:0,noJuhyuWeeks:0,juhyuH:0,juhyuAmt:0,lostJuhyuH:0,lostJuhyuAmt:0,detail:[]};
  var dailyJuhyu=wkH/wkDays;

  // 소정근무일별 결근 여부 수집 (공휴일 제외, 재직기간 밖 제외)
  var jRng=empServiceDayRange(e,yr,mth,dim);
  var schedAbsArr=[]; // {d, wk, isAbs}
  for(var d=jRng.startDay;d<=jRng.endDay;d++){
    var dow=new Date(yr,mth-1,d).getDay();
    if(!sched[DN[dow]]) continue;          // 스케줄 없는 요일
    var dateStr=mo+"-"+p2(d);
    if(isHoliday(dateStr)) continue;       // 공휴일 제외 (공휴일은 소정근무일 아님)
    var wk=Math.floor((first+d-1)/7);
    var ab=((S.absence[e.id]||{})[mo]||{})[p2(d)]||0;
    schedAbsArr.push({d:d,wk:wk,isAbs:ab>0});
  }

  // 연속결근 묶기: 소정근무일 기준으로 연속된 결근 → 하나의 사건
  // "연속"이란 소정근무일 순서상 바로 이어지는 날들
  var absEvents=[]; // 각 사건이 어떤 주들에 걸치는지
  var i=0;
  while(i<schedAbsArr.length){
    if(schedAbsArr[i].isAbs){
      var event={weeks:{}};
      event.weeks[schedAbsArr[i].wk]=true;
      var j=i+1;
      // 소정근무일 기준 바로 다음 날도 결근이면 같은 사건
      while(j<schedAbsArr.length && schedAbsArr[j].isAbs && schedAbsArr[j-1].isAbs){
        event.weeks[schedAbsArr[j].wk]=true;
        j++;
      }
      absEvents.push(event);
      i=j;
    } else { i++; }
  }

  // 주별 상태 결정
  var weekMap={};
  for(var k=0;k<schedAbsArr.length;k++){
    var wk2=schedAbsArr[k].wk;
    if(!weekMap[wk2]) weekMap[wk2]={hasAbs:false,penalized:false};
  }
  // 각 사건에서 박탈할 주 1개만 선택 (첫 번째 주)
  for(var ei=0;ei<absEvents.length;ei++){
    var eWks=Object.keys(absEvents[ei].weeks).map(Number).sort(function(a,b){return a-b;});
    if(eWks.length>0 && weekMap[eWks[0]]!==undefined) weekMap[eWks[0]].penalized=true;
  }

  var mPayH=calcMonthlyPayHours(e)||209;
  var hr=e.totalPay?calcBase(e).hourRate:(e.base/mPayH);
  var juhyuWeeks=0, noJuhyuWeeks=0, detail=[];
  var allWks=Object.keys(weekMap).map(Number).sort(function(a,b){return a-b;});
  for(var wi=0;wi<allWks.length;wi++){
    var wki=allWks[wi];
    if(weekMap[wki].penalized){
      noJuhyuWeeks++;
      detail.push({week:wki+1,miss:true});
    } else {
      juhyuWeeks++;
      detail.push({week:wki+1,miss:false});
    }
  }
  // ── 4.345주 고정 방식 (고용노동부 표준) ──
  // 총 주휴 기준: 4.345주 × 일당주휴시간. 박탈은 실제 결근 주수만큼 차감
  var BASE_WKS=4.345;
  var lostWks=Math.min(noJuhyuWeeks, BASE_WKS);
  var earnedWks=Math.max(0, BASE_WKS-noJuhyuWeeks);
  var totalJuhyuH=Math.round(earnedWks*dailyJuhyu*10)/10;
  var juhyuAmt=Math.round(hr*totalJuhyuH);
  var lostJuhyuH=Math.round(lostWks*dailyJuhyu*10)/10;
  var lostJuhyuAmt=Math.round(hr*lostJuhyuH);
  return {juhyuWeeks:earnedWks,noJuhyuWeeks:noJuhyuWeeks,
    juhyuH:totalJuhyuH,juhyuAmt:juhyuAmt,
    lostJuhyuH:lostJuhyuH,lostJuhyuAmt:lostJuhyuAmt,detail:detail};
}

function calcPay(e,mo){
  var probRate=isProbMonth(e,mo)?0.9:1.0; // 수습기간이면 임금 90%
  // ── 입사/퇴사가 이번 달 중간에 있으면 달력일수 기준 일할계산 비율 ──
  // (월급 × 재직일수/그 달 총 일수). flexPartTime/시간제 스케줄 모드는
  // 실근무일수 기반이라 자연히 반영되므로 이 비율은 정규직 고정급에만 사용.
  var _pYr=parseInt(mo.split("-")[0]), _pMth=parseInt(mo.split("-")[1]);
  var _pDim=new Date(_pYr,_pMth,0).getDate();
  var _pRng=empServiceDayRange(e,_pYr,_pMth,_pDim);
  var _pSvcDays=Math.max(0,_pRng.endDay-_pRng.startDay+1);
  var _pFull=(_pRng.startDay===1 && _pRng.endDay===_pDim);
  var payRatio=_pFull?1:(_pDim>0?_pSvcDays/_pDim:0);
  // ── 비정기 호출형 알바 (flexPartTime) ──
  if((e.contractType||e.workType)==='시간제' && e.flexPartTime){
    var hr2f=Math.round((e.hourlyRate||10030)*probRate);
    var ptWeeks=getPtWeeks(e.id,mo);
    var totalHf=0,juhyuHf=0,juhyuWksf=0;
    for(var wi=0;wi<ptWeeks.length;wi++){
      totalHf+=ptWeeks[wi].totalH;
      if(ptWeeks[wi].hasJuhyu){juhyuHf+=ptWeeks[wi].juhyuH;juhyuWksf++;}
    }
    totalHf=Math.round(totalHf*100)/100;
    var logsF=getPtLogs(e.id,mo);
    var actualDaysF=logsF.length;
    var mealAmtF=e.meal||0;
    var mealActualF=actualDaysF>0?mealAmtF:0;
    var carAmtF=e.carAllow||0;
    var carActualF=actualDaysF>0?carAmtF:0;
    var basePayF=Math.round(hr2f*totalHf);
    var juhyuAmtF=Math.round(hr2f*juhyuHf);
    var extrasF=getEmpExtras(e.id,mo),extraTotalF=0;
    for(var eif=0;eif<extrasF.length;eif++)extraTotalF+=extrasF[eif].amount||0;
    var grossF=basePayF+juhyuAmtF+mealActualF+carActualF+extraTotalF;
    var b4f=Math.max(0,basePayF+juhyuAmtF+extraTotalF);
    var insF=calcEmpIns(b4f,e.ins4,Math.max(0,grossF-mealActualF-carActualF),e.dependents||1);
    return {mode:'parttime',h:hr2f,base:basePayF,baseOnly:basePayF,
      juhyuAmt:juhyuAmtF,juhyuH:juhyuHf,hasJuhyu:juhyuHf>0,
      jInfo:{juhyuWeeks:juhyuWksf,noJuhyuWeeks:0,juhyuH:juhyuHf,juhyuAmt:juhyuAmtF,lostJuhyuAmt:0,lostJuhyuH:0,detail:ptWeeks},
      lostJuhyu:0,
      ext:0,night:0,hol:0,earlyDed:0,
      mealAmt:mealAmtF,mealActual:mealActualF,mealDed:0,
      carAmt:carAmtF,carActual:carActualF,carDed:0,
      offDays:0,absDays:0,lvDays:0,absDeduct:0,
      extras:extrasF,extraTotal:extraTotalF,
      gross:grossF,pension:insF.pension,health:insF.health,empIns:insF.empIns,care:insF.care,
      incomeTax:insF.incomeTax,localTax:insF.localTax,
      totalDed:insF.total,net:grossF-insF.total,insuranceBase:b4f,
      tot:{ext:0,night:0,holiday:0,early:0},
      monthH:totalHf,weekH:0,actualDays:actualDaysF,dailyH:0,isProb:probRate<1,flexPT:true,ptWeeks:ptWeeks,
      payRatio:payRatio,isPartialMonth:!_pFull,svcDays:_pSvcDays,totalDaysInMonth:_pDim};
  }
  // ── 시간제 모드 (고정 스케줄) ──
  if((e.contractType||e.workType)==='시간제'){
    var tot2=getMonthOT(e.id,mo);
    var hr2=Math.round((e.hourlyRate||10030)*probRate); // 수습기간 반영
    var mealAmt2=e.meal||0;
    var absDays2=getMonthAbsence(e.id,mo);
    var mWD2=calcMonthWorkDays(e,mo);       // 재직기간 내 소정근무일 (분자)
    var mWD2Full=calcMonthWorkDaysFull(e,mo); // 월 전체 소정근무일 (분모)
    var mealActual2=_pSvcDays<=0?0:(mWD2Full>0?Math.round(mealAmt2*Math.max(0,mWD2-absDays2)/mWD2Full):mealAmt2);
    var mealDed2=mealAmt2-mealActual2;
    var carAmt2=e.carAllow||0;
    var carActual2=_pSvcDays<=0?0:(mWD2Full>0?Math.round(carAmt2*Math.max(0,mWD2-absDays2)/mWD2Full):carAmt2);
    var carDed2=carAmt2-carActual2;
    var sched2=e.schedule||{}, schedDays2=Object.keys(sched2), weekH2=0;
    for(var di2=0;di2<schedDays2.length;di2++){var ds2=sched2[schedDays2[di2]];var wh3=(parseInt(ds2.e)-parseInt(ds2.s))-(parseFloat(ds2.b)||0);if(wh3<0)wh3+=24;weekH2+=wh3;}
    if(!weekH2) weekH2=(e.workHours||4)*(schedDays2.length||5);
    var wkD3=schedDays2.length||5;
    // 시간제: 그 달의 실제 스케줄 요일 수로 계산 (주말알바 등 월마다 일수가 다름)
    var _PTDI={"월":1,"화":2,"수":3,"목":4,"금":5,"토":6,"일":0};
    var _ptYr=parseInt(mo.split('-')[0]), _ptMo=parseInt(mo.split('-')[1])-1;
    var _ptDIM=new Date(_ptYr,_ptMo+1,0).getDate();
    var _ptDOWs=schedDays2.map(function(d){return _PTDI[d];}).filter(function(v){return v!==undefined;});
    var _ptActual=0;
    var _ptRng=empServiceDayRange(e,_ptYr,_ptMo+1,_ptDIM); // 입사/퇴사 반영한 재직일 범위
    if(_ptDOWs.length){
      for(var _ptD=_ptRng.startDay;_ptD<=_ptRng.endDay;_ptD++){
        if(_ptDOWs.indexOf(new Date(_ptYr,_ptMo,_ptD).getDay())>=0) _ptActual++;
      }
    }
    var _dailyH3=wkD3>0?weekH2/wkD3:weekH2;
    // 스케줄 요일이 설정돼 있으면 실제 일수×일근무시간(재직기간 반영), 없으면 4.345주 평균에 재직비율 적용
    var monthH3=_ptActual>0?Math.round(_ptActual*_dailyH3):Math.round(weekH2*4.345*payRatio);
    var hasJuhyu3=weekH2>=15;
    var jInfo3=hasJuhyu3?calcJuhyuForMonth(e,mo):{juhyuWeeks:0,noJuhyuWeeks:0,juhyuH:0,juhyuAmt:0,lostJuhyuH:0,lostJuhyuAmt:0,detail:[]};
    jInfo3.juhyuAmt=Math.round(jInfo3.juhyuAmt*payRatio);
    jInfo3.lostJuhyuAmt=Math.round(jInfo3.lostJuhyuAmt*payRatio);
    var basePay3=Math.round(hr2*monthH3);
    var extP3=Math.round(hr2*1.5*tot2.ext), nightP3=Math.round(hr2*2.0*tot2.night);
    var holP3=Math.round(hr2*1.5*tot2.holiday), earlyD3=Math.round(hr2*tot2.early);
    var absD3=Math.round(absDays2*hr2*(weekH2/Math.max(wkD3,1)));
    var lvDays2=getMonthLeaveDays(e.id,mo);
    var extras3=getEmpExtras(e.id,mo), extraTotal3=0;
    for(var ei3=0;ei3<extras3.length;ei3++) extraTotal3+=extras3[ei3].amount||0;
    var gross3=basePay3+jInfo3.juhyuAmt-jInfo3.lostJuhyuAmt+extP3+nightP3+holP3-earlyD3-absD3+mealActual2+carActual2+extraTotal3;
    var b4_3=Math.max(0,basePay3+jInfo3.juhyuAmt-jInfo3.lostJuhyuAmt+extP3+nightP3+holP3-earlyD3-absD3+extraTotal3);
    var insR4=calcEmpIns(b4_3,e.ins4,Math.max(0,gross3-mealActual2-carActual2),e.dependents||1);
    return {mode:'parttime',h:hr2,base:basePay3,baseOnly:basePay3,
      juhyuAmt:jInfo3.juhyuAmt,juhyuH:jInfo3.juhyuH,hasJuhyu:hasJuhyu3,
      jInfo:jInfo3,lostJuhyu:jInfo3.lostJuhyuAmt,
      ext:extP3,night:nightP3,hol:holP3,earlyDed:earlyD3,
      mealAmt:mealAmt2,mealActual:mealActual2,mealDed:mealDed2,
      carAmt:carAmt2,carActual:carActual2,carDed:carDed2,
      offDays:absDays2,absDays:absDays2,lvDays:lvDays2,absDeduct:absD3,
      extras:extras3,extraTotal:extraTotal3,
      gross:gross3,pension:insR4.pension,health:insR4.health,empIns:insR4.empIns,care:insR4.care,
      incomeTax:insR4.incomeTax,localTax:insR4.localTax,
      totalDed:insR4.total,net:gross3-insR4.total,insuranceBase:b4_3,
      tot:tot2,monthH:monthH3,weekH:weekH2,actualDays:_ptActual,dailyH:_dailyH3,isProb:probRate<1,
      payRatio:payRatio,isPartialMonth:!_pFull,svcDays:_pSvcDays,totalDaysInMonth:_pDim};
  }
  var tot=getMonthOT(e.id,mo);
  var over5=isOver5(mo);
  var absDays=getMonthAbsence(e.id,mo);       // 결근일수
  var lvDays=getMonthLeaveDays(e.id,mo);       // 해당월 연차사용일수
  var mWD=calcMonthWorkDays(e,mo);             // 월 소정근무일수
  // 식대: 결근일만 차감 (연차는 유급휴가이므로 식대 전액 지급)
  var mealAmt=e.meal||0;
  var mWDFull=calcMonthWorkDaysFull(e,mo); // 월 전체 소정근무일 (분모)
  var mealActual=_pSvcDays<=0?0:(mWDFull>0?Math.round(mealAmt*Math.max(0,mWD-absDays)/mWDFull):mealAmt);
  var mealDed=mealAmt-mealActual;
  // 자가운전보조금: 식대와 동일하게 결근일 비례 차감 (비과세)
  var carAmt=e.carAllow||0;
  var carActual=_pSvcDays<=0?0:(mWDFull>0?Math.round(carAmt*Math.max(0,mWD-absDays)/mWDFull):carAmt);
  var carDed=carAmt-carActual;
  var offDays=absDays; // 식대 차감은 결근만
  // 추가 항목
  var extras=getEmpExtras(e.id,mo);
  var extraTotal=0; for(var ei=0;ei<extras.length;ei++) extraTotal+=extras[ei].amount||0;
  // 일일 소정근로시간 (결근 일당 차감 기준)
  var dailyH=(function(){
    var sched=e.schedule||{}, days=Object.keys(sched);
    if(days.length){var tot2=0;for(var di=0;di<days.length;di++){var ds=sched[days[di]];var wh2=(parseInt(ds.e)-parseInt(ds.s))-(parseFloat(ds.b)||1);if(wh2<0)wh2+=24;tot2+=wh2;}return tot2/days.length;}
    return e.workHours||8;
  })();
  // 주휴수당: 주별 결근 여부로 주별 지급/박탈 판단
  var wkDaysForJuhyu=(e.workDays&&e.workDays.length)?e.workDays.length:
                     (e.schedule?Object.keys(e.schedule).length:5);
  var wkH=e.weeklyHours||((e.workHours||8)*wkDaysForJuhyu);
  var hasJuhyu=wkH>=15;
  var jInfo=hasJuhyu?calcJuhyuForMonth(e,mo):{juhyuWeeks:0,noJuhyuWeeks:0,juhyuH:0,juhyuAmt:0,lostJuhyuH:0,lostJuhyuAmt:0,detail:[]};
  var juhyuH=jInfo.juhyuH;

  if(over5 && e.totalPay){
    var effTotalPay=Math.round(e.totalPay*probRate*payRatio); // 수습 90% + 입사/퇴사 일할계산 반영
    var cb=calcBase(e);
    var hr=Math.round(cb.hourRate*probRate);
    // 주휴수당 금액도 수습비율 + 입사/퇴사 일할계산 비율 반영 (화면 표시 일관성)
    jInfo.juhyuAmt=Math.round(jInfo.juhyuAmt*probRate*payRatio);
    jInfo.lostJuhyuAmt=Math.round(jInfo.lostJuhyuAmt*probRate*payRatio);
    var extPay    =Math.round(hr*1.5*tot.ext);
    var nightPay2 =Math.round(hr*2.0*tot.night);
    var holPay    =Math.round(hr*1.5*tot.holiday);
    var earlyDed  =Math.round(hr*tot.early);
    var absDeduct =Math.round(absDays*(hr*dailyH));
    var lostJuhyu=jInfo.lostJuhyuAmt;
    var gross=effTotalPay+extPay+nightPay2+holPay+mealActual+carActual+extraTotal-absDeduct-lostJuhyu-earlyDed;
    var b4=Math.max(0,effTotalPay+extPay+nightPay2+holPay+extraTotal-absDeduct-lostJuhyu-earlyDed);
    var insR1=calcEmpIns(b4,e.ins4,Math.max(0,gross-mealActual-carActual),e.dependents||1);
    var pension=insR1.pension,health=insR1.health,empIns=insR1.empIns,care=insR1.care;
    var totalDed=insR1.total;
    var juhyuAmt=jInfo.juhyuAmt;
    var effCbBase=Math.round(cb.base*probRate*payRatio);
    var baseOnly=Math.max(0,effCbBase-juhyuAmt-jInfo.lostJuhyuAmt);
    return {mode:"over5",h:hr,base:effCbBase,baseOnly:baseOnly,juhyuAmt:juhyuAmt,juhyuH:juhyuH,hasJuhyu:hasJuhyu,
      jInfo:jInfo,lostJuhyu:lostJuhyu,
      nightPayFixed:Math.round(cb.nightPay*probRate*payRatio),nightH:cb.nightH,
      ext:extPay,night:nightPay2,hol:holPay,earlyDed:earlyDed,
      mealAmt:mealAmt,mealActual:mealActual,mealDed:mealDed,carAmt:carAmt,carActual:carActual,carDed:carDed,offDays:offDays,absDays:absDays,lvDays:lvDays,
      extras:extras,extraTotal:extraTotal,
      gross:gross,pension:pension,health:health,empIns:empIns,care:care,
      incomeTax:insR1.incomeTax,localTax:insR1.localTax,
      totalDed:totalDed,net:gross-totalDed,insuranceBase:b4,
      tot:tot,absDeduct:absDeduct,totalPay:effTotalPay,isProb:probRate<1,
      payRatio:payRatio,isPartialMonth:!_pFull,svcDays:_pSvcDays,totalDaysInMonth:_pDim};
  } else {
    var fullBase=Math.round(e.base*probRate); // 수습 90% 반영 (시급 산정 기준, 일할계산 미반영)
    var mPayH=calcMonthlyPayHours(e)||209;
    var h=fullBase/mPayH;
    var effBase=Math.round(fullBase*payRatio); // 입사/퇴사 일할계산 반영 (실지급 기준액)
    var juhyuAmt2=Math.round(jInfo.juhyuAmt*payRatio);
    var lostJuhyu2=Math.round(jInfo.lostJuhyuAmt*payRatio);
    if(probRate<1){ juhyuAmt2=Math.round(juhyuAmt2*probRate); lostJuhyu2=Math.round(lostJuhyu2*probRate); }
    var baseOnly2=Math.max(0,effBase-juhyuAmt2-lostJuhyu2);
    var ext=Math.round(h*1.5*tot.ext);
    var night=Math.round(h*2.0*tot.night);
    var hol=Math.round(h*1.5*tot.holiday);
    var earlyDed=Math.round(h*tot.early);
    var absDeduct=Math.round(absDays*(h*dailyH));
    var gross=effBase+ext+night+hol+mealActual+carActual+extraTotal-absDeduct-lostJuhyu2-earlyDed;
    var b4=Math.max(0,effBase+ext+night+hol+extraTotal-absDeduct-lostJuhyu2-earlyDed);
    var insR2=calcEmpIns(b4,e.ins4,Math.max(0,gross-mealActual-carActual),e.dependents||1);
    var pension=insR2.pension,health=insR2.health,empIns=insR2.empIns,care=insR2.care;
    var totalDed=insR2.total;
    return {mode:"under5",h:h,base:effBase,baseOnly:baseOnly2,juhyuAmt:juhyuAmt2,juhyuH:juhyuH,hasJuhyu:hasJuhyu,
      jInfo:jInfo,lostJuhyu:lostJuhyu2,
      ext:ext,night:night,hol:hol,earlyDed:earlyDed,
      mealAmt:mealAmt,mealActual:mealActual,mealDed:mealDed,carAmt:carAmt,carActual:carActual,carDed:carDed,offDays:offDays,absDays:absDays,lvDays:lvDays,
      extras:extras,extraTotal:extraTotal,
      gross:gross,pension:pension,health:health,empIns:empIns,care:care,
      incomeTax:insR2.incomeTax,localTax:insR2.localTax,
      totalDed:totalDed,net:gross-totalDed,insuranceBase:b4,
      tot:tot,absDeduct:absDeduct,isProb:probRate<1,
      payRatio:payRatio,isPartialMonth:!_pFull,svcDays:_pSvcDays,totalDaysInMonth:_pDim};
  }
}

// ── 상태 ──
function empSt(e){
  var done=S.done[e.id]||[], items=makeChecklist(e);
  var i, d;
  // 계약 만료 체크
  if(e.contractEnd){var cd=daysLeft(e.contractEnd);if(cd<0) return "danger"; if(cd<=30) return "warn";}
  for(i=0;i<items.length;i++){
    if(done.indexOf(items[i].id)>=0) continue;
    d=daysLeft(items[i].due); if(d!==null&&d<0) return "danger";
  }
  if(!e.healthCertExpiry) return "warn";
  var hd=daysLeft(e.healthCertExpiry);
  if(hd<0) return "danger"; if(hd<=30) return "warn";
  for(i=0;i<items.length;i++){
    if(done.indexOf(items[i].id)>=0) continue;
    d=daysLeft(items[i].due); if(d!==null&&d<=14) return "warn";
  }
  return "ok";
}

function renderStats(){

  function si(l,v,c){ return "<div class='st'><div class='st-l'>"+l+"</div><div class='st-v "+(c||"")+"'>"+v+"</div></div>"; }

  if(v===0){
    t=S.emps.length; dn=0; wn=0;
    for(i=0;i<S.emps.length;i++){var st=empSt(S.emps[i]);if(st==="danger")dn++;else if(st==="warn")wn++;}

    }
    return "<div class='stats' style='grid-template-columns:repeat(3,minmax(0,1fr))'>"
      +si("연장",p.tot.ext.toFixed(1)+"h","c-warn")

      +si("휴일",p.tot.holiday.toFixed(1)+"h","c-danger")

      +"<div class='stats' style='grid-template-columns:repeat(3,minmax(0,1fr));margin-top:6px'>"
      +si("추가수당",(addPay>0?"+":"")+comma(addPay)+"원","c-ok")
      +si("차감 합계",totalDed>0?"-"+comma(totalDed)+"원":"없음",totalDed>0?"c-danger":"")
      +si("순액",(addPay-totalDed>=0?"+":"")+comma(addPay-totalDed)+"원",addPay-totalDed>=0?"c-ok":"c-danger")
      +"</div>"
      +"<div class='stats' style='grid-template-columns:repeat(2,minmax(0,1fr));margin-top:6px'>"
      +si("예상 총급여",comma(p.gross)+"원","c-ok")
      +si("최대 주간 연장",maxW.toFixed(1)+"h"+(maxW>12?" ⚠":""),maxW>12?"c-danger":maxW>8?"c-warn":"")
      +"</div>";
  }
  if(v===2){
    var tot=0,ins=0,histMo=0; for(i=0;i<S.emps.length;i++){p=calcPay(S.emps[i],S.cm);tot+=p.gross;ins+=p.totalDed;histMo+=((S.payHistory[S.emps[i].id]||[]).length);}

  }

    var sg=0; for(i=0;i<S.emps.length;i++) if((S.ct[S.emps[i].id]||{}).signed) sg++;
    return s4(si("전체",S.emps.length+"명",""),si("계약완료",sg+"명","c-ok"),si("미완료",(S.emps.length-sg)+"명","c-danger"),si("완료율",(S.emps.length?Math.round(sg/S.emps.length*100):0)+"%",""));
  }
  if(v===4){
    t=GLOBAL.length; dn=0; wn=0;
    for(i=0;i<GLOBAL.length;i++){if(S.gdone.indexOf(GLOBAL[i].id)>=0) continue;var dl=daysLeft(GLOBAL[i].due);if(dl!==null&&dl<0)dn++;else if(dl!==null&&dl<=14)wn++;}

function openPtLogModal(eid,mo,logId){
  var logs=getPtLogs(eid,mo);
  var existing=null; if(logId){for(var _fi=0;_fi<logs.length;_fi++){if(logs[_fi].id===logId){existing=logs[_fi];break;}}}
  var yr=parseInt(mo.split('-')[0]),m=parseInt(mo.split('-')[1]);
  // default date: today if same month, else 1st of month
  var todayStr=TODAY.getFullYear()+'-'+p2(TODAY.getMonth()+1)+'-'+p2(TODAY.getDate());
  var defDate=existing?existing.date:(todayStr.slice(0,7)===mo?todayStr:mo+'-01');
  var defS=existing?existing.s:"09";
  var defE=existing?existing.e:"17";
  var defB=existing?(existing.b!==undefined?existing.b:1):1;
  var defNote=existing?existing.note||"":"";

  // 시간 선택 옵션
  function hOpts(sel){ var o=""; for(var h=0;h<24;h++){var v=p2(h); o+="<option value='"+v+"'"+(sel===v||sel===String(h)?" selected":"")+">"+(v)+"시</option>";} return o;}
  function minOpts(sel){ var o=""; [0,10,20,30,40,50].forEach(function(mn){var v=p2(mn);o+="<option value='"+v+"'"+(sel===v?" selected":"")+">"+(v)+"분</option>";}); return o;}

  function toHH(v){if(!v&&v!==0)return"00";var s=String(v);if(s.indexOf(':')>=0)return s.split(':')[0];return p2(parseInt(v)||0);}
  function toMM(v){if(!v&&v!==0)return"00";var s=String(v);if(s.indexOf(':')>=0)return p2(parseInt(s.split(':')[1])||0);return"00";}

  var modal="<div class='modal' style='width:360px'>";
  modal+="<div class='modal-title'>"+(existing?"근무 기록 수정":"근무 기록 추가")+"</div>";
  modal+="<div class='fg'><label class='fl'>날짜</label><input type='date' id='ptl-date' value='"+defDate+"' min='"+mo+"-01' max='"+mo+"-"+new Date(yr,m,0).getDate()+"'></div>";
  modal+="<div class='fr' style='margin-bottom:.85rem'>";
  modal+="<div class='fg'><label class='fl'>출근 시각</label><div style='display:flex;gap:4px'><select id='ptl-sh' style='flex:1;font-size:13px;padding:7px 6px;border-radius:8px;border:1px solid #ddd;font-family:inherit'>"+hOpts(toHH(defS))+"</select><select id='ptl-sm' style='flex:1;font-size:13px;padding:7px 6px;border-radius:8px;border:1px solid #ddd;font-family:inherit'>"+minOpts(toMM(defS))+"</select></div></div>";
  modal+="<div class='fg'><label class='fl'>퇴근 시각</label><div style='display:flex;gap:4px'><select id='ptl-eh' style='flex:1;font-size:13px;padding:7px 6px;border-radius:8px;border:1px solid #ddd;font-family:inherit'>"+hOpts(toHH(defE))+"</select><select id='ptl-em' style='flex:1;font-size:13px;padding:7px 6px;border-radius:8px;border:1px solid #ddd;font-family:inherit'>"+minOpts(toMM(defE))+"</select></div></div>";
  modal+="</div>";
  modal+="<div class='fg'><label class='fl'>휴게 시간</label><select id='ptl-b' style='width:100%;font-size:13px;padding:8px 10px;border-radius:8px;border:1px solid #ddd;font-family:inherit'>";
  [0,0.5,1,1.5,2,2.5,3].forEach(function(v){modal+="<option value='"+v+"'"+(defB===v?" selected":"")+">"+(v===0?"없음":v+"시간 ("+v*60+"분)")+"</option>";});
  modal+="</select></div>";
  modal+="<div class='fg'><label class='fl'>메모 (선택)</label><input type='text' id='ptl-note' value='"+defNote+"' placeholder='예: 설기작업, 포장 등'></div>";
  modal+="<div id='ptl-preview' style='font-size:12px;color:#2563eb;background:#eff6ff;border-radius:8px;padding:8px 12px;margin-bottom:.85rem'></div>";
  modal+="<div class='modal-actions'><button class='btn' data-action='closeMod'>취소</button><button class='btn pri' onclick=\"savePtLogEntry('"+eid+"','"+mo+"','"+(logId?logId:"")+"')\">저장</button></div>";
  modal+="</div>";

  var ov=document.createElement('div');
  ov.className='overlay'; ov.style.zIndex='200';
  ov.innerHTML=modal;
  ov.addEventListener('click',function(ev){if(ev.target===ov)ov.remove();});
  document.body.appendChild(ov);

  // 실시간 미리보기
  function updPtlPreview(){
    var sh=document.getElementById('ptl-sh').value, sm=document.getElementById('ptl-sm').value;
    var eh=document.getElementById('ptl-eh').value, em=document.getElementById('ptl-em').value;
    var b=parseFloat(document.getElementById('ptl-b').value)||0;
    var sTotal=parseInt(sh)+parseInt(sm)/60, eTotal=parseInt(eh)+parseInt(em)/60;
    var h=eTotal-sTotal-b; if(h<0)h+=24;
    var pr=document.getElementById('ptl-preview');
    var _empRef=getEmp(eid);
    if(pr) pr.textContent=sh+":"+sm+" ~ "+eh+":"+em+" (휴게 "+b+"h) = 실근무 "+(Math.round(h*100)/100).toFixed(1)+"h · "+comma(Math.round((_empRef?_empRef.hourlyRate||10030:10030)*h))+"원";
  }
  ['ptl-sh','ptl-sm','ptl-eh','ptl-em','ptl-b'].forEach(function(id){
    var el=document.getElementById(id); if(el){el.addEventListener('change',updPtlPreview);}
  });
  updPtlPreview();
}

function savePtLogEntry(eid,mo,logId){
  if(logId==='') logId=null;
  var date=document.getElementById('ptl-date').value;
  var sh=document.getElementById('ptl-sh').value, sm=document.getElementById('ptl-sm').value;
  var eh=document.getElementById('ptl-eh').value, em=document.getElementById('ptl-em').value;
  var b=parseFloat(document.getElementById('ptl-b').value)||0;
  var note=document.getElementById('ptl-note').value.trim();
  if(!date){toast('날짜를 선택하세요');return;}
  var logs=getPtLogs(eid,mo);
  var entry={id:logId||('pl'+Date.now()),date:date,s:sh+':'+sm,e:eh+':'+em,b:b,note:note};
  if(logId){
    var idx=-1; for(var _fii=0;_fii<logs.length;_fii++){if(logs[_fii].id===logId){idx=_fii;break;}}
    if(idx>=0)logs[idx]=entry; else logs.push(entry);
  } else {
    logs.push(entry);
  }
  logs.sort(function(a,b2){return a.date.localeCompare(b2.date);});
  setPtLogs(eid,mo,logs);
  var _ovs=document.querySelectorAll('.overlay'); for(var _oi=0;_oi<_ovs.length;_oi++){_ovs[_oi].remove();}
  render();
  toast('✓ 근무 기록 저장됨');
}

function delPtLog(eid,mo,logId){
  if(!confirm('이 근무 기록을 삭제할까요?'))return;
  var logs=getPtLogs(eid,mo).filter(function(l){return l.id!==logId;});
  setPtLogs(eid,mo,logs);
  render();
  toast('✓ 삭제됨');
}

function renderOT(){

  var DN2=["일","월","화","수","목","금","토"];
  var p=emp?calcPay(emp,S.cm):{ext:0,night:0,hol:0,gross:0,tot:{ext:0,night:0,holiday:0},absDays:0,absDeduct:0};
  var t=p.tot, h="", i;

    h+="<button class='ot-ebtn"+(S.emps[i].id===eid?" active":"")+"' data-action='setOtEmp' data-id='"+S.emps[i].id+"'>"+S.emps[i].name+_badge+"</button>";
  }
  h+="</div>";
  // 비정기 호출형 알바: 별도 근무기록 UI
  if(emp&&emp.flexPartTime) return h+renderFlexPT(emp,S.cm);
  // otsum 제거됨 - 상단 renderStats()에 통합
  // 기능5: 주별 연장시간 계산
  var weekExt={};
  for(var d=1;d<=daysInMo;d++){
    var wi=Math.floor((first+d-1)/7);
    var ot_d=getOT(eid,S.cm,d);
    weekExt[wi]=(weekExt[wi]||0)+(ot_d.ext||0);
  }
  var overWeeks=[];
  var wkeys=Object.keys(weekExt);
  for(var wi2=0;wi2<wkeys.length;wi2++){if(weekExt[wkeys[wi2]]>12)overWeeks.push(parseInt(wkeys[wi2])+1);}
  if(overWeeks.length>0){
    h+="<div style='background:#fee2e2;border:1px solid #fca5a5;border-radius:8px;padding:.6rem 1rem;margin-bottom:.75rem;font-size:12px;color:#dc2626;font-weight:700'>⚠ 주 52시간 초과: "+overWeeks.map(function(w){return w+"주차 (연장 "+weekExt[w-1].toFixed(1)+"h/12h)";}).join(" · ")+" — 위반 시 2년 이하 징역</div>";
  }
  h+="<div style='display:flex;align-items:center;gap:8px;margin-bottom:.75rem'>";
  h+="<p class='hint' style='margin:0;flex:1'>날짜 칸을 클릭하면 입력창이 열립니다 · 0 입력 시 자동 숨김 · <span style='color:#dc2626'>빨간 테두리: 주 12h 초과</span></p>";
  h+="<button class='btn' style='font-size:11px;padding:4px 8px;white-space:nowrap' data-action='clearMonthData' data-id='"+eid+"'>이달 데이터 초기화</button>";
  h+="</div>";
  // ── 이달 수당 합계 바 ──
  var sumBar="";
  if(t.ext>0)     sumBar+="<span class='ot-chip chip-ext' style='font-size:11px;padding:3px 9px'>연장수당 "+t.ext.toFixed(1)+"시간</span>";
  if(t.night>0)   sumBar+="<span class='ot-chip chip-night' style='font-size:11px;padding:3px 9px'>야근수당 "+t.night.toFixed(1)+"시간</span>";
  if(t.holiday>0) sumBar+="<span class='ot-chip chip-hol' style='font-size:11px;padding:3px 9px'>휴일수당 "+t.holiday.toFixed(1)+"시간</span>";
  if(t.early>0)   sumBar+="<span class='ot-chip chip-early' style='font-size:11px;padding:3px 9px'>조기퇴근 "+t.early.toFixed(1)+"시간</span>";
  if(p.absDays>0) sumBar+="<span class='ot-chip chip-abs' style='font-size:11px;padding:3px 9px'>결근 "+p.absDays+"일</span>";
  if(sumBar) h+="<div class='ot-sum-bar'>"+sumBar+"</div>";
  else h+="<div class='ot-sum-bar'><span style='font-size:12px;color:#aaa'>이달 입력된 수당 없음</span></div>";
  // ── 드롭다운 달력 그리드 ──
  h+="<div class='ot-day-grid'>";
  var days7=["일","월","화","수","목","금","토"];
  for(i=0;i<7;i++) h+="<div class='ot-dh"+(i===0?" sun":i===6?" sat":"")+"'>"+days7[i]+"</div>";
  for(i=0;i<first;i++) h+="<div class='ot-dc empty-day'></div>";
  for(var d2=1;d2<=daysInMo;d2++){
    var dow=(first+d2-1)%7, key=p2(d2);
    var dateStr=S.cm+"-"+key;
    var ot=getOT(eid,S.cm,d2), ab=getAbsence(eid,S.cm,d2);
    var chips=otDayChips(ot,ab), hasData=chips.length>0;
    var isPubHol=isHoliday(dateStr);
    var weekIdxDay=Math.floor((first+d2-1)/7);
    var isWeekOver=(weekExt[weekIdxDay]||0)>12;
    var alignRight=(dow>=5)?1:0;
    var cellCls="ot-dc"+(dow===0||isPubHol?" hol-day":"")+(hasData?" has-data":"")+(isWeekOver?" week-ov":"");
    var dnCls="ot-dn"+(dow===0||isPubHol?" sun":dow===6?" sat":"");
    var pubDot=isPubHol&&dow!==0?"<span style='font-size:8px;color:#ef4444;margin-left:1px'>●</span>":"";
    h+="<div class='"+cellCls+"' id='otd-"+key+"' onclick='toggleOTDay(\""+eid+"\",\""+S.cm+"\",\""+key+"\","+alignRight+")'>";
    h+="<div class='"+dnCls+"'>"+d2+pubDot+"<span class='ot-toggle' style='color:"+(hasData?"#888":"#ccc")+"'>"+(hasData?"▾":"+")+"</span></div>";
    if(hasData) h+="<div class='ot-chips'>"+chips.join("")+"</div>";
    h+="</div>";
  }
  h+="</div>";
  // 주별 요약 테이블
  h+="<div style='margin-top:.6rem;overflow-x:auto'><table class='ph-table' style='font-size:12px'><thead><tr style='background:#f9f8f5'><th>주차</th><th>기간</th><th>연장 합계</th><th>상태</th></tr></thead><tbody>";
  for(var wk=0;wk<Object.keys(weekExt).length;wk++){
    var wStart=wk*7+1-first; var wEnd=wStart+6;
    var wsDisp=Math.max(1,wStart); var weDisp=Math.min(daysInMo,wEnd);
    var wExt=weekExt[wk]||0;
    var over=wExt>12;
    h+="<tr style='"+(over?"background:#fff5f5;color:#dc2626;font-weight:700":"")+"'>";
    h+="<td>"+(wk+1)+"주</td><td>"+wsDisp+"일~"+weDisp+"일</td>";
    h+="<td>"+wExt.toFixed(1)+"h / 12h</td>";
    h+="<td>"+(over?"<span class='badge bd'>⚠ 초과</span>":wExt>8?"<span class='badge bw'>주의</span>":"<span class='badge bs'>정상</span>")+"</td>";
    h+="</tr>";
  }
  h+="</tbody></table></div>";
  return h;
}

function getShift(){
  var s=document.getElementById("fs").value, en=document.getElementById("fe").value;
  var br=parseFloat(document.getElementById("fb").value)||1;
  var raw=((parseInt(en)-parseInt(s)+24)%24)||24; // 0 → 24h 교대 처리
  var wh=Math.max(0, raw-br);
  return {shift:s+":00~"+en+":00",startTime:s,endTime:en,breakHour:br,workHours:wh,isNight:parseInt(s)<6};
}
function updShift(){
  var el=document.getElementById("shpv"); if(!el) return;
  var fs=document.getElementById("fs"); if(!fs) return;
  var sv=fs.value, ev=document.getElementById("fe").value;
  var br=parseFloat(document.getElementById("fb").value)||1;
  var raw=((parseInt(ev)-parseInt(sv)+24)%24)||24;
  var wh=Math.max(0, raw-br);
  el.innerHTML="근무: <b>"+sv+":00 ~ "+ev+":00</b> · 휴게 "+br+"h · 실근로 <b>"+wh+"h</b>"+(parseInt(sv)<6?" <span style='color:#dc2626'>야간</span>":"");
  // 포괄임금 미리보기
  var pr=document.getElementById("paypr"); if(!pr) return;
  var totalEl=document.getElementById("ftotal"); if(!totalEl) return;
  var totalPay=parseInt(totalEl.value)||0;
  if(totalPay>0){
    var tmpE={startTime:sv,endTime:ev,breakHour:br};
    var nightH=calcMonthlyNightHours(tmpE);
    var hourRate=totalPay/(209+nightH*0.5);
    var base=Math.round(hourRate*209);
    var nightPay=Math.round(hourRate*nightH*0.5);
    pr.style.display="block";
    pr.innerHTML="📊 역산 결과: 시급 <b>"+comma(Math.round(hourRate))+"원</b> · 기본급 <b>"+comma(base)+"원</b> · 야간수당(월 "+nightH+"h 포함) <b>"+comma(nightPay)+"원</b> · 합계 <b>"+comma(base+nightPay)+"원</b>";
  } else {
    pr.style.display="none";
  }
}

// ── 근로소득세 간이세액 계산 (2026년 기준) ──
// 방식: 월 과세급여 → 연간환산 → 근로소득공제 → 기본공제 → 누진세율 → 세액공제
function calcIncomeTax(taxableGross, dependents, monthlyIns){
  if(taxableGross<=0) return {incomeTax:0,localTax:0};
  var dep=Math.max(1,parseInt(dependents)||1);
  var annual=taxableGross*12;
  var annualIns=(monthlyIns||0)*12; // 4대보험료 연간 소득공제 ★

  // 근로소득공제
  var wd;
  if(annual<=5000000)       wd=annual*0.70;
  else if(annual<=15000000) wd=3500000+(annual-5000000)*0.40;
  else if(annual<=45000000) wd=7500000+(annual-15000000)*0.15;
  else if(annual<=100000000)wd=12000000+(annual-45000000)*0.05;
  else                       wd=Math.min(14250000+(annual-100000000)*0.02,20000000);

  var incomeAmt=Math.max(0,annual-wd);
  // 과세표준 = 근로소득금액 - 기본공제 - 4대보험료(소득공제) ★
  var taxBase=Math.max(0,incomeAmt-1500000*dep-annualIns);

  // 산출세액 (누진세율)
  var annualTax;
  if(taxBase<=12000000)       annualTax=taxBase*0.06;
  else if(taxBase<=46000000)  annualTax=720000+(taxBase-12000000)*0.15;
  else if(taxBase<=88000000)  annualTax=5820000+(taxBase-46000000)*0.24;
  else if(taxBase<=150000000) annualTax=15900000+(taxBase-88000000)*0.35;
  else if(taxBase<=300000000) annualTax=37600000+(taxBase-150000000)*0.38;
  else if(taxBase<=500000000) annualTax=94600000+(taxBase-300000000)*0.40;
  else                         annualTax=174600000+(taxBase-500000000)*0.42;

  // 근로소득세액공제 + 한도(총급여 기준 동적 계산) ★
  var credit;
  if(annualTax<=1300000) credit=annualTax*0.55;
  else credit=715000+(annualTax-1300000)*0.30;
  var creditLimit;
  if(annual<=33000000)      creditLimit=740000;
  else if(annual<=70000000) creditLimit=740000-(annual-33000000)*0.008;
  else                       creditLimit=Math.max(500000,660000-(annual-70000000)*0.5);
  credit=Math.min(credit,creditLimit);

  // 표준세액공제 13만원
  var finalAnnual=Math.max(0,annualTax-credit-130000);
  var incomeTax=Math.floor(finalAnnual/12/10)*10;
  var localTax=Math.floor(incomeTax*0.1/10)*10;
  return {incomeTax:incomeTax,localTax:localTax};
}

function calcEmpIns(b4, ins4, taxableGross, dependents){
  var i=ins4||{pension:true,health:true,empIns:true,care:true};
  var pension=i.pension?Math.round(b4*(S.ins.pension/100)):0;
  var health= i.health?Math.round(b4*(S.ins.health/100)):0;
  var empIns= i.empIns?Math.round(b4*(S.ins.empIns/100)):0;
  var care=   (i.care&&i.health)?Math.round(health*(S.ins.care/100)):0;
  // 4대보험 합계를 소득공제로 calcIncomeTax에 전달 ★
  var monthlyIns=pension+health+empIns+care;
  var it=calcIncomeTax(taxableGross||0, dependents||1, monthlyIns);
  var incomeTax=it.incomeTax, localTax=it.localTax;
  var total=pension+health+empIns+care+incomeTax+localTax;
  return {pension:pension,health:health,empIns:empIns,care:care,incomeTax:incomeTax,localTax:localTax,total:total};
}

function applyAllDays(s,e,b){
  var DAYS=["월","화","수","목","금","토","일"];
  for(var i=0;i<5;i++){
    var d=DAYS[i];
    document.getElementById("sd_"+d).checked=true;
    document.getElementById("ss_"+d).disabled=false; document.getElementById("ss_"+d).style.opacity="1"; document.getElementById("ss_"+d).value=s;
    document.getElementById("se_"+d).disabled=false; document.getElementById("se_"+d).style.opacity="1"; document.getElementById("se_"+d).value=e;
    document.getElementById("sb_"+d).disabled=false; document.getElementById("sb_"+d).style.opacity="1"; document.getElementById("sb_"+d).value=b;
  }
  for(var i=5;i<7;i++){
    var d=DAYS[i];
    document.getElementById("sd_"+d).checked=false;
    ["ss_","se_","sb_"].forEach(function(p){var el=document.getElementById(p+d);if(el){el.disabled=true;el.style.opacity="0.35";}});

function getScheduleFromForm(){
  var DAYS=["월","화","수","목","금","토","일"], sched={};
  for(var i=0;i<DAYS.length;i++){
    var d=DAYS[i], cb=document.getElementById("sd_"+d);
    if(cb&&cb.checked){
      sched[d]={s:document.getElementById("ss_"+d).value, e:document.getElementById("se_"+d).value, b:parseFloat(document.getElementById("sb_"+d).value)||1};
    }
  }
  return sched;
}
function updSchedPv(){
  var DAYS=["월","화","수","목","금","토","일"], sched=getScheduleFromForm(), days=Object.keys(sched);
  var pv=document.getElementById("schedpv"); if(!pv) return;
  if(!days.length){pv.textContent="근무 요일을 선택하세요";return;}
  var weekH=0, dayStrs=[];
  for(var i=0;i<DAYS.length;i++){
    var d=DAYS[i], ds=sched[d]; if(!ds) continue;
    var wh=(parseInt(ds.e)-parseInt(ds.s))-(parseFloat(ds.b)||1); if(wh<0)wh+=24;
    weekH+=wh;
    var wh2=document.getElementById("swh_"+d); if(wh2) wh2.textContent=wh+"h";
    dayStrs.push(d+" "+ds.s+":00~"+ds.e+":00");
  }
  // also update non-working days
  for(var i=0;i<DAYS.length;i++){var d=DAYS[i];if(!sched[d]){var wh2=document.getElementById("swh_"+d);if(wh2)wh2.textContent="-";}}
  var juhyu=weekH>=15?Math.round(weekH/days.length):0, monthH=Math.round((weekH+juhyu)*4.345);
  pv.innerHTML="주 "+days.length+"일 근무 · 주 "+weekH.toFixed(1)+"h · 주휴 "+juhyu+"h · 월 소정 "+monthH+"h";
  // 포괄임금 역산
  var tp=parseInt(document.getElementById("ftotal")?document.getElementById("ftotal").value:0)||0;
  var baseRow=document.getElementById("base-row");
  if(baseRow) baseRow.style.display=tp>0?"none":"";
  var pr=document.getElementById("paypr"); if(!pr) return;
  if(tp>0){
    var nightH=0;
    for(var i=0;i<DAYS.length;i++){var d=DAYS[i];var ds=sched[d];if(!ds)continue;var tmp={startTime:ds.s,endTime:ds.e,breakHour:ds.b};nightH+=calcNightHoursPerDay(tmp)*4.345;}
    nightH=Math.round(nightH*10)/10;
    var hr=Math.round(tp/(monthH+nightH*0.5));
    var base=Math.round(hr*monthH), nightPay=Math.round(hr*nightH*0.5);
    pr.innerHTML="📊 역산: 시급 <b>"+comma(hr)+"원</b> · 기본급 <b>"+comma(base)+"원</b> · 야간수당(월 "+nightH+"h) <b>"+comma(nightPay)+"원</b> · 합계 <b>"+comma(base+nightPay)+"원</b>";
    pr.style.display="block";
  }else{pr.style.display="none";}
}

function isCanvasBlank(canvas){
  var ctx=canvas.getContext("2d");
  var data=ctx.getImageData(0,0,canvas.width,canvas.height).data;
  for(var i=3;i<data.length;i+=4){if(data[i]>0) return false;}
  return true;
}
function initSignPad(canvasId, clearBtnId, savedDataUrl){
  var canvas=document.getElementById(canvasId);
  var clearBtn=document.getElementById(clearBtnId);
  if(!canvas) return;
  var ctx=canvas.getContext("2d");
  // 실제 픽셀 크기 설정
  var rect=canvas.getBoundingClientRect();
  canvas.width=rect.width||340; canvas.height=120;
  ctx.strokeStyle="#1a1a1a"; ctx.lineWidth=2; ctx.lineCap="round"; ctx.lineJoin="round";
  // 저장된 서명 복원
  if(savedDataUrl){
    var img=new Image(); img.onload=function(){ctx.drawImage(img,0,0,canvas.width,canvas.height);};
    img.src=savedDataUrl;
  }
  var drawing=false, lx=0, ly=0;
  function getPos(ev){
    var r=canvas.getBoundingClientRect(), scaleX=canvas.width/r.width, scaleY=canvas.height/r.height;
    var src=(ev.touches&&ev.touches[0])||ev;
    return {x:(src.clientX-r.left)*scaleX, y:(src.clientY-r.top)*scaleY};
  }
  function start(ev){ev.preventDefault();drawing=true;var p=getPos(ev);lx=p.x;ly=p.y;}
  function move(ev){ev.preventDefault();if(!drawing)return;var p=getPos(ev);ctx.beginPath();ctx.moveTo(lx,ly);ctx.lineTo(p.x,p.y);ctx.stroke();lx=p.x;ly=p.y;}
  function end(ev){ev.preventDefault();drawing=false;}
  canvas.addEventListener("mousedown",start); canvas.addEventListener("mousemove",move);
  canvas.addEventListener("mouseup",end); canvas.addEventListener("mouseleave",end);
  canvas.addEventListener("touchstart",start,{passive:false}); canvas.addEventListener("touchmove",move,{passive:false});
  canvas.addEventListener("touchend",end);
  if(clearBtn) clearBtn.addEventListener("click",function(){ctx.clearRect(0,0,canvas.width,canvas.height);});
}
function initSignPads(eid){
  var ct=S.ct[eid]||{};
  setTimeout(function(){
    initSignPad("sign-biz","clear-sign-biz",ct.signBiz||null);
    initSignPad("sign-emp","clear-sign-emp",ct.signEmp||null);

}

// 기능3: 브라우저 푸시 알림
function checkNotifications(){
  if(!("Notification" in window)) return;
  if(Notification.permission==="denied") return;
  var todayKey="tteok_notif_"+TODAY.toISOString().split("T")[0];
  if(localStorage.getItem(todayKey)==="1") return; // 오늘 이미 발송
  function doNotify(){
    var msgs=[];
    // 보건증 만료 체크
    for(var i=0;i<S.emps.length;i++){
      var e=S.emps[i];
      if(e.healthCertExpiry){
        var hd=daysLeft(e.healthCertExpiry);
        if(hd===30||hd===7) msgs.push("🏥 "+e.name+"님 보건증 만료 "+hd+"일 전");
      }
      // 근로계약 만료 체크 (e.contractEnd 에서 읽기)
      if(e.contractEnd){
        var cd=daysLeft(e.contractEnd);
        if(cd===30||cd===7) msgs.push("📄 "+e.name+"님 근로계약 만료 "+cd+"일 전");
      }
    }
    // 자가품질검사 예정일 체크
    for(var j=0;j<S.quality.length;j++){
      var q=S.quality[j];
      if(q.nextDate){
        var qd=daysLeft(q.nextDate);
        if(qd===7||qd===1) msgs.push("🔬 "+q.item+" 자가품질검사 "+qd+"일 후");
      }
    }
    if(msgs.length>0){
      for(var k=0;k<msgs.length;k++){
        try{new Notification("남씨네전통식품 인사관리",{body:msgs[k],icon:"data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍡</text></svg>"});}catch(er){}
      }
    }
    try{localStorage.setItem(todayKey,"1");}catch(er){}
  }
  if(Notification.permission==="granted"){
    doNotify();
  } else {
    Notification.requestPermission().then(function(perm){
      if(perm==="granted") doNotify();
    }).catch(function(){});
  }
}
